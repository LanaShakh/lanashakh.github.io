<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Захват — локация (генератор)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:#bfe0ef;}
  body{font-family:'Inter',system-ui,sans-serif;}
  #app{position:fixed;inset:0;} canvas{display:block;}
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(135% 100% at 50% 42%, rgba(0,0,0,0) 54%, rgba(8,18,28,0.32) 100%);}
  .tag{position:fixed;left:14px;top:12px;z-index:10;color:#fff;font-weight:800;font-size:15px;text-shadow:0 2px 6px rgba(0,0,0,.5);}
  .tag small{display:block;font-weight:600;font-size:12px;opacity:.9;}
  .hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:10;
    background:rgba(15,18,38,.6);color:#eaf0ff;font-size:12.5px;padding:7px 14px;border-radius:999px;backdrop-filter:blur(6px);}
  #loading{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#0f1226,#171a3a);color:#cfe0ff;font-weight:700;}
  #err{position:fixed;inset:0;z-index:41;display:none;align-items:center;justify-content:center;text-align:center;
    background:#1a1020;color:#ffd3da;padding:24px;font-size:14px;}
</style>
</head>
<body>
  <div id="app"></div>
  <div class="vignette"></div>
  <div class="tag">Локация (генератор) 🌲<small>поляна + лес кольцом + тропа/ручей — правилами</small></div>
  <div class="hint">Башни на поляне. Покрути пальцем/мышью.</div>
  <div id="loading">Генерация локации…</div>
  <div id="err"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';

let renderer, scene, camera, controls, composer;
const TAU=Math.PI*2, TEAM={p:0x3b82f6,e:0xef4444,n:0x9aa3b2};
function sky(){ const c=document.createElement('canvas'); c.width=4;c.height=256; const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,256); g.addColorStop(0,'#a9dcf2'); g.addColorStop(.55,'#8ccbe6'); g.addColorStop(1,'#74b8d8');
  x.fillStyle=g; x.fillRect(0,0,4,256); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t; }

async function init(){
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.NoToneMapping;
  document.getElementById('app').appendChild(renderer.domElement);

  scene=new THREE.Scene(); scene.background=sky(); scene.fog=new THREE.Fog(0x9fd0e6, 26, 70);
  try{ const pm=new THREE.PMREMGenerator(renderer); scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture; }catch(e){}

  camera=new THREE.PerspectiveCamera(33, innerWidth/innerHeight, 0.1, 400);
  camera.position.set(15,11,17);
  controls=new OrbitControls(camera, renderer.domElement);
  controls.target.set(0,0.8,0); controls.enableDamping=true; controls.dampingFactor=0.08;
  controls.autoRotate=true; controls.autoRotateSpeed=0.34; controls.minDistance=9; controls.maxDistance=46; controls.maxPolarAngle=Math.PI*0.49;

  scene.add(new THREE.HemisphereLight(0xdfeeff,0x5c7a42,0.5));
  const sun=new THREE.DirectionalLight(0xfff1d6,1.55); sun.position.set(12,20,8); sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048); const sc=sun.shadow.camera;
  sc.left=-26;sc.right=26;sc.top=22;sc.bottom=-22;sc.near=1;sc.far=90; sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.04; sun.shadow.radius=4; scene.add(sun);
  const fill=new THREE.DirectionalLight(0xbcd2ff,0.32); fill.position.set(-15,9,-4); scene.add(fill);
  const rim=new THREE.DirectionalLight(0xffffff,0.7); rim.position.set(-8,8,-16); scene.add(rim);

  const loader=new GLTFLoader();
  const load=async f=>{ const g=await loader.loadAsync(f);
    g.scene.traverse(c=>{ if(c.isMesh){ c.castShadow=true; c.receiveShadow=true; if(c.material){ c.material.metalness=0; c.material.envMapIntensity=0.5; } } }); return g.scene; };
  const N={
    toak:'nat/tree_oak.glb', tdef:'nat/tree_default.glb', tfat:'nat/tree_fat.glb',
    tpRA:'nat/tree_pineRoundA.glb', tpRC:'nat/tree_pineRoundC.glb', tpDA:'nat/tree_pineDefaultA.glb',
    toakF:'nat/tree_oak_fall.glb', tdefF:'nat/tree_default_fall.glb', tfatF:'nat/tree_fat_fall.glb',
    bush:'nat/plant_bush.glb', bushL:'nat/plant_bushLarge.glb', bushD:'nat/plant_bushDetailed.glb', bushS:'nat/plant_bushSmall.glb',
    grass:'nat/grass.glb', grassL:'nat/grass_large.glb', grassLf:'nat/grass_leafs.glb',
    fR_A:'nat/flower_redA.glb', fR_B:'nat/flower_redB.glb', fY_A:'nat/flower_yellowA.glb', fY_B:'nat/flower_yellowB.glb', fP_B:'nat/flower_purpleB.glb',
    mR:'nat/mushroom_redGroup.glb', mT:'nat/mushroom_tanGroup.glb',
    rkSB:'nat/rock_smallB.glb', rkSD:'nat/rock_smallD.glb', rkLB:'nat/rock_largeB.glb', rkLD:'nat/rock_largeD.glb',
    bridge:'nat/bridge_wood.glb',
    tb:'td/tower-round-build-b.glb', tc:'td/tower-round-build-c.glb', td:'td/tower-round-build-d.glb', tf:'td/tower-round-build-f.glb' };
  const M={}; await Promise.all(Object.entries(N).map(async([k,f])=>{ M[k]=await load('models/'+f); }));

  // continuous ground (no tiles), fills the screen
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(260,260).rotateX(-Math.PI/2),
    new THREE.MeshStandardMaterial({color:0x6fb24a, roughness:1}));
  ground.receiveShadow=true; scene.add(ground);
  // gentle large color patches for ground variation
  { let s=7; const r=()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; };
    for(let i=0;i<22;i++){ const col=i%2?0x649f43:0x7cbf57; const rad=4+r()*8;
      const p=new THREE.Mesh(new THREE.CircleGeometry(rad,18).rotateX(-Math.PI/2),
        new THREE.MeshStandardMaterial({color:col,roughness:1,transparent:true,opacity:0.5,depthWrite:false}));
      p.position.set((r()*2-1)*30,0.01+i*0.0005,(r()*2-1)*22); scene.add(p);} }

  // ---------------- LOGICAL LOCATION GENERATOR ----------------
  let seed=20240604; const rng=()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; };
  const pick=a=>a[Math.floor(rng()*a.length)];
  const placed=[]; // {x,z,r} occupancy for spacing
  const fits=(x,z,r)=>placed.every(p=>Math.hypot(x-p.x,z-p.z)>=r+p.r);
  const drop=(m,x,z,ry,s,r)=>{ const o=m.clone(true); o.position.set(x,0,z); o.rotation.y=ry; o.scale.setScalar(s); scene.add(o); placed.push({x,z,r}); };

  const CLEAR=6.5;                      // open gameplay clearing radius
  const rad=(x,z)=>Math.hypot(x,z*1.22);

  // 1) TOWERS = heroes in the clearing (reserve their spots)
  const heroes=[ {m:M.tb,x:-2.4,z:-1.2,t:'p',s:1.0}, {m:M.tc,x:2.2,z:1.0,t:'e',s:1.06},
                 {m:M.td,x:0,z:3.0,t:'n',s:1.12}, {m:M.tc,x:-3.2,z:2.4,t:'p',s:1.06}, {m:M.tf,x:3.4,z:-2.4,t:'e',s:1.2} ];
  for(const h of heroes){ const o=h.m.clone(true); o.position.set(h.x,0,h.z); o.scale.setScalar(h.s); scene.add(o);
    const ring=new THREE.Mesh(new THREE.TorusGeometry(0.52,0.075,12,40).rotateX(Math.PI/2),
      new THREE.MeshStandardMaterial({color:TEAM[h.t],emissive:TEAM[h.t],emissiveIntensity:0.5,roughness:0.5}));
    ring.position.set(h.x,0.05,h.z); ring.scale.setScalar(h.s); scene.add(ring); placed.push({x:h.x,z:h.z,r:1.6}); }

  // 2) FOREST as groves (clusters of one species), denser toward the edge
  const greens=[M.toak,M.tdef,M.tfat,M.tpRA,M.tpRC,M.tpDA], falls=[M.toakF,M.tdefF,M.tfatF];
  for(let g=0; g<20; g++){
    const a=rng()*TAU, gr=CLEAR+2 + rng()*13;
    const gx=Math.cos(a)*gr, gz=Math.sin(a)*gr*0.82;
    const species = rng()<0.30 ? falls : greens;          // some autumn groves for colour
    const n=3+Math.floor(rng()*5);
    for(let i=0;i<n;i++){
      const x=gx+(rng()-0.5)*4.5, z=gz+(rng()-0.5)*4.5;
      if(rad(x,z)<CLEAR) continue;                          // keep the clearing open
      const s=1.0+rng()*0.7, r=0.85*s;
      if(!fits(x,z,r)) continue;
      drop(pick(species), x,z, rng()*TAU, s, r);
      if(rng()<0.4){ const bx=x+(rng()-0.5)*1.6, bz=z+(rng()-0.5)*1.6;   // understory at tree base
        if(fits(bx,bz,0.3)) drop(rng()<0.5?M.mR:M.bushS, bx,bz, rng()*TAU, 0.6+rng()*0.4, 0.3); }
    }
  }
  // 3) scattered bushes (mid-ground)
  for(let i=0;i<46;i++){ const a=rng()*TAU, gr=CLEAR-1+rng()*15; const x=Math.cos(a)*gr,z=Math.sin(a)*gr*0.82;
    if(rad(x,z)<CLEAR-1||!fits(x,z,0.5)) continue; drop(pick([M.bush,M.bushL,M.bushD,M.bushS]),x,z,rng()*TAU,0.7+rng()*0.5,0.5); }
  // 4) flower patches (one colour per patch)
  const palettes=[[M.fR_A,M.fR_B],[M.fY_A,M.fY_B],[M.fP_B]];
  for(let p=0;p<11;p++){ const a=rng()*TAU, gr=4+rng()*14; const cx=Math.cos(a)*gr,cz=Math.sin(a)*gr*0.82; const set=pick(palettes);
    for(let i=0;i<7;i++){ const x=cx+(rng()-0.5)*2.6,z=cz+(rng()-0.5)*2.6; if(!fits(x,z,0.28)) continue; drop(pick(set),x,z,rng()*TAU,0.7+rng()*0.4,0.28); } }
  // 5) grass tufts (light, everywhere incl. clearing fringe)
  for(let i=0;i<120;i++){ const a=rng()*TAU, gr=3+rng()*18; const x=Math.cos(a)*gr,z=Math.sin(a)*gr*0.82;
    if(!fits(x,z,0.22)) continue; drop(pick([M.grass,M.grassL,M.grassLf]),x,z,rng()*TAU,0.7+rng()*0.6,0.22); }
  // 6) rock piles (clusters)
  for(let p=0;p<7;p++){ const a=rng()*TAU, gr=CLEAR+rng()*14; const cx=Math.cos(a)*gr,cz=Math.sin(a)*gr*0.82;
    for(let i=0;i<3;i++){ const x=cx+(rng()-0.5)*1.8,z=cz+(rng()-0.5)*1.8; if(!fits(x,z,0.45)) continue; drop(pick([M.rkSB,M.rkSD,M.rkLB,M.rkLD]),x,z,rng()*TAU,0.7+rng()*0.5,0.45); } }

  // 7) path + stream + bridge (a coherent feature line)
  const ribbon=(pts,w,col,flat)=>{ const curve=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(p[0],0.03,p[1])));
    const geo=new THREE.TubeGeometry(curve,48,w,10,false); const mesh=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:col,roughness:1}));
    mesh.scale.y=flat; mesh.position.y=0.02; mesh.receiveShadow=true; scene.add(mesh); };
  ribbon([[-24,-3],[-12,-1],[-3,-3],[6,-1],[20,2]], 1.15, 0x9c7b4a, 0.05);    // dirt path
  ribbon([[-6,18],[-3,8],[-1,0],[2,-9],[5,-20]], 1.5, 0x49a9d8, 0.05);        // stream
  { const b=M.bridge.clone(true); b.position.set(-2,0.05,-2.5); b.rotation.y=0.7; b.scale.setScalar(1.3); scene.add(b); } // bridge over crossing

  // ---------------- post ----------------
  try{
    const rt=new THREE.WebGLRenderTarget(innerWidth,innerHeight,{type:THREE.HalfFloatType, samples:8});
    composer=new EffectComposer(renderer,rt);
    composer.addPass(new RenderPass(scene,camera));
    try{ composer.addPass(new GTAOPass(scene,camera,innerWidth,innerHeight)); }catch(e){ console.warn('AO',e); }
    composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.12,0.6,0.96));
    composer.addPass(new OutputPass());
    try{ composer.addPass(new SMAAPass(innerWidth,innerHeight)); }catch(e){}
  }catch(e){ composer=null; }

  addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight); if(composer) composer.setSize(innerWidth,innerHeight); });

  document.getElementById('loading').style.display='none';
  renderer.setAnimationLoop(()=>{ controls.update(); if(composer) composer.render(); else renderer.render(scene,camera); });
}
init().catch(e=>{ console.error(e); document.getElementById('loading').style.display='none';
  const el=document.getElementById('err'); el.style.display='flex'; el.textContent='Ошибка сцены: '+(e&&e.message?e.message:e); });
</script>
</body>
</html>
