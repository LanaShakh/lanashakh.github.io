<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1226">
<title>Захват — 3D</title>
<meta name="description" content="Захват — 3D-стратегия: тяни связи между башнями, усиливай свои и захватывай чужие.">
<style>
  :root{ --ink:#eef0ff; --muted:#a7adda; --p:#2f6fe0; --e:#e23b4e; --panel:rgba(255,255,255,.06); }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{ font-family:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    color:var(--ink); user-select:none; background:#9fd0e8; height:100%; }
  #app{position:fixed; inset:0;}
  canvas{display:block; touch-action:none;}
  .labels{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:6;}
  .vignette{position:fixed; inset:0; pointer-events:none; z-index:5;
    background:radial-gradient(125% 90% at 50% 42%, rgba(0,0,0,0) 55%, rgba(8,18,28,0.30) 100%);}
  .tlabel{ background:#fff; border:2.5px solid #888; border-radius:999px; color:#333;
    font-weight:800; font-size:14px; padding:1px 9px; transform:translate(-50%,-50%);
    box-shadow:0 3px 8px rgba(0,0,0,.25); white-space:nowrap; }
  .tlabel.en{ border-radius:7px; }              /* врага отличает и форма, не только цвет */
  .tlabel.nt{ border-style:dashed; }
  /* плашка над башней, ждущей выбора класса.
     ВАЖНО: transform у самого элемента занят CSS2DRenderer'ом — анимируем только внутренний span */
  .pickchip span{ display:inline-block; background:linear-gradient(140deg,#ffd166,#ffa62b); color:#3a2400;
    font-weight:800; font-size:12px; padding:3px 10px; border-radius:999px; white-space:nowrap;
    box-shadow:0 4px 14px rgba(255,180,60,.6); border:2px solid rgba(255,255,255,.65);
    animation:chipBob .9s ease-in-out infinite alternate; }
  @keyframes chipBob{ from{ transform:translateY(0) scale(1); } to{ transform:translateY(-5px) scale(1.07); } }
  /* башня ждёт выбора класса — подсвечиваем подпись (без transform!) */
  .tlabel.pick{ animation:pickPulse .85s ease-in-out infinite alternate; }
  @keyframes pickPulse{ from{ box-shadow:0 3px 8px rgba(0,0,0,.25); border-color:#888; }
                        to{ box-shadow:0 0 18px 6px rgba(255,209,102,.9); border-color:#ffc23d; } }

  .powbar{ position:fixed; top:0; left:0; right:0; height:5px; z-index:11; display:flex; }
  .powbar div{ transition:width .35s ease; }
  #powP{ background:#3b82f6; width:33%; }
  #powN{ background:rgba(148,163,184,.55); width:34%; }
  #powE{ background:#ef4444; width:33%; }

  .hud{ position:fixed; top:5px; left:0; right:0; display:flex; align-items:center; gap:10px;
    padding:max(10px,env(safe-area-inset-top)) 14px 10px; z-index:10; }
  .hud .title{font-weight:800; font-size:17px; letter-spacing:-.3px; white-space:nowrap; text-shadow:0 2px 6px rgba(0,0,0,.4);}
  .hud .title small{display:block; font-weight:600; font-size:11px; color:#eaf3ff; opacity:.85; margin-top:1px;}
  .counts{display:flex; gap:8px; margin-left:auto; align-items:center;}
  .pill{background:rgba(15,18,38,.5); border:1px solid rgba(255,255,255,.14); border-radius:999px;
    padding:5px 11px; font-weight:800; font-size:14px; display:flex; align-items:center; gap:6px; backdrop-filter:blur(6px);}
  .pill .dot{width:9px;height:9px;border-radius:50%;} .dot.p{background:var(--p);} .dot.e{background:var(--e);}
  .iconbtn{background:rgba(15,18,38,.5); border:1px solid rgba(255,255,255,.16); color:#fff;
    width:38px;height:38px;border-radius:11px; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(6px);}
  .iconbtn:active{transform:translateY(1px);}
  .hint{ position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:10;
    background:rgba(15,18,38,.62); border:1px solid rgba(255,255,255,.12); backdrop-filter:blur(6px);
    color:#eaf0ff; font-size:12.5px; padding:8px 15px; border-radius:999px; max-width:92%; text-align:center; transition:opacity .4s;}

  .overlay{ position:fixed; inset:0; z-index:30; display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; text-align:center; padding:26px; background:rgba(15,18,38,.82); backdrop-filter:blur(7px); }
  .overlay.show{display:flex;}
  .overlay .big{font-size:38px; font-weight:800; letter-spacing:-1px;}
  .overlay.win .big{background:linear-gradient(120deg,#21d4fd,#2bffb0);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .overlay.lose .big{color:var(--e);}
  .overlay .sub{color:var(--muted); font-size:15px; max-width:300px;}
  .row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
  .btn{border:1px solid rgba(255,255,255,.14); background:var(--panel); color:var(--ink);
    font-family:inherit; font-weight:700; font-size:15px; padding:12px 20px; border-radius:12px; cursor:pointer;}
  .btn.primary{background:linear-gradient(120deg,#7c5cff,#a17bff); border-color:transparent; box-shadow:0 8px 22px rgba(124,92,255,.35);}
  .btn:active{transform:translateY(2px);}
  .levels{display:grid; grid-template-columns:repeat(4,56px); gap:12px; justify-content:center;}
  .lvl{width:56px;height:56px;border-radius:14px; background:var(--panel); border:1px solid rgba(255,255,255,.14);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:20px; cursor:pointer; color:var(--ink);}
  .lvl.locked{opacity:.35; cursor:default;} .lvl.done{border-color:#2bffb0; color:#2bffb0;}
  .lvl.inf{border-color:#7c5cff; color:#cdbcff;}
  .ovh{font-size:13px; color:var(--muted); letter-spacing:1.5px; text-transform:uppercase; font-weight:700;}

  .stars{font-size:30px; letter-spacing:5px; color:#ffd166; text-shadow:0 2px 12px rgba(255,209,102,.45); min-height:36px;}
  .stars .off{color:rgba(255,255,255,.22); text-shadow:none;}
  .lvl{flex-direction:column; gap:2px;}
  .lvl .st{font-size:10px; color:#ffd166; letter-spacing:1px; line-height:1; font-weight:400;}
  .lvl .st .off{color:rgba(255,255,255,.22);}

  .tut{position:fixed; left:50%; transform:translateX(-50%); bottom:16px; z-index:12; display:none; align-items:center; gap:11px;
    background:rgba(15,18,38,.8); border:1px solid rgba(255,255,255,.16); backdrop-filter:blur(8px);
    border-radius:16px; padding:11px 15px; max-width:min(92%,430px); box-shadow:0 10px 30px rgba(0,0,0,.35);}
  .tut.show{display:flex; animation:tutIn .35s ease;}
  @keyframes tutIn{from{opacity:0; transform:translate(-50%,10px);} to{opacity:1; transform:translate(-50%,0);}}
  .tut .ava{font-size:28px; filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));}
  .tut .txt{font-size:13.5px; line-height:1.45; color:#eaf0ff;}
  .tut .txt b{color:#ffd166;}
  #confetti{position:fixed; inset:0; z-index:35; pointer-events:none;}

  #count{position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
    z-index:13; pointer-events:none; gap:6px;}
  #count .n{font-size:96px; font-weight:800; color:#fff; text-shadow:0 6px 30px rgba(0,0,0,.55); animation:countPop .68s ease;}
  #count .n.go{font-size:54px;}
  #count .s{font-size:13px; color:#fff; opacity:.85; text-shadow:0 2px 8px rgba(0,0,0,.5);}
  @keyframes countPop{from{transform:scale(1.7);opacity:0;} 30%{opacity:1;} to{transform:scale(1);opacity:.92;}}

  .diffRow{display:flex; gap:8px;}
  .dbtn{border:1px solid rgba(255,255,255,.14); background:var(--panel); color:var(--muted); font-family:inherit;
    font-weight:700; font-size:13px; padding:8px 13px; border-radius:999px; cursor:pointer;}
  .dbtn.sel{color:#fff; border-color:#7c5cff; background:rgba(124,92,255,.25);}

  .cmdRow{display:flex; align-items:center; gap:11px; background:var(--panel); border:1px solid rgba(255,255,255,.14);
    border-radius:14px; padding:10px 14px; width:min(92vw,360px); font-size:14px; text-align:left;}
  .cmdRow .ce{font-size:30px;}
  .cmdRow small{color:var(--muted); font-size:12.5px;}
  .trLegend{font-size:12.5px; color:var(--muted); width:min(92vw,360px); line-height:1.55; text-align:left;}
  .trLegend b{color:#dfe2ff;}
  .gambits{display:flex; flex-direction:column; gap:10px; width:min(92vw,360px);}
  .gcard{display:flex; align-items:center; gap:12px; text-align:left; background:var(--panel);
    border:1px solid rgba(255,255,255,.14); border-radius:14px; padding:12px 14px; cursor:pointer;
    color:var(--ink); font-family:inherit; font-size:14px;}
  .gcard:active{transform:translateY(2px);}
  .gcard .gi{font-size:26px;}
  .gcard b{display:block; font-size:15px;}
  .gcard small{color:var(--muted); font-size:12.5px;}

  .spec{position:fixed; z-index:14; display:none; gap:9px; transform:translate(-50%,-135%);}
  .spec.show{display:flex; animation:tutIn .2s ease;}
  .spec button{width:48px; height:48px; border-radius:50%; font-size:21px; cursor:pointer;
    border:2px solid rgba(255,255,255,.4); background:rgba(15,18,38,.88); box-shadow:0 6px 16px rgba(0,0,0,.4);}
  .spec button:active{transform:scale(.94);}

  .rush{position:fixed; right:16px; bottom:max(16px,env(safe-area-inset-bottom)); z-index:11; display:none;
    width:58px; height:58px; border-radius:50%; border:2px solid rgba(255,255,255,.25); cursor:pointer;
    background:linear-gradient(140deg,#7c5cff,#a17bff); color:#fff; font-size:24px; font-weight:800; font-family:inherit;
    box-shadow:0 8px 22px rgba(124,92,255,.45);}
  .rush.cd{background:rgba(15,18,38,.6); box-shadow:none; font-size:17px; color:#a7adda;}
  .rush.on{background:linear-gradient(140deg,#ffd166,#ff9f43); box-shadow:0 0 26px rgba(255,209,102,.8); animation:rushPulse .5s ease infinite alternate;}
  @keyframes rushPulse{from{transform:scale(1);}to{transform:scale(1.09);}}
  .rush:active{transform:translateY(2px);}

  .heroCard{background:var(--panel); border:1px solid rgba(255,255,255,.14); border-radius:14px;
    padding:12px 14px; max-width:min(92vw,340px); text-align:left; font-size:13px; max-height:38vh; overflow-y:auto;}
  .heroCard .hh{display:flex; align-items:center; gap:8px; font-weight:800; font-size:15px; margin-bottom:8px;}
  .heroCard .hh .hst{margin-left:auto; color:#ffd166; font-weight:800;}
  .heroCard .hrow{display:flex; align-items:center; gap:8px; padding:4px 0; color:#dfe2ff;}
  .heroCard .hrow.locked{opacity:.42;}
  .heroCard .hrow .hn{margin-left:auto; color:var(--muted); font-size:11.5px; white-space:nowrap;}
  .chip{display:inline-block; background:rgba(124,92,255,.18); border:1px solid rgba(124,92,255,.4);
    border-radius:999px; padding:3px 9px; font-size:12px; margin:2px 3px 2px 0; color:#dfe2ff;}
  .menuNote{font-size:12px; color:var(--muted);}

  #loading{ position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:linear-gradient(160deg,#0f1226,#171a3a); color:#cfe0ff; }
  .spinner{width:42px;height:42px;border-radius:50%;border:4px solid rgba(255,255,255,.18); border-top-color:#7c5cff; animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  #err{display:none; max-width:80%; text-align:center; color:#ffd3da; font-size:14px; line-height:1.6;}
</style>
</head>
<body>
  <div id="app"></div>
  <div class="vignette"></div>
  <div class="labels" id="labels"></div>

  <div class="hud">
    <div class="title">Захват<small id="mapName">Карта 1</small></div>
    <div class="counts">
      <div class="pill"><span class="dot p"></span><span id="cntP">0</span></div>
      <div class="pill"><span class="dot e"></span><span id="cntE">0</span></div>
      <button class="iconbtn" id="sndBtn">🔊</button>
      <button class="iconbtn" id="speedBtn">×1</button>
      <button class="iconbtn" id="menuBtn">☰</button>
    </div>
  </div>
  <div class="hint" id="hint">Тяни от своей башни к другой — создать связь. Убрать: тапни по линии.</div>

  <div class="tut" id="tut"><div class="ava">🦉</div><div class="txt" id="tutTxt"></div></div>
  <canvas id="confetti"></canvas>
  <div id="count"></div>

  <div class="overlay" id="ovEnd"><div class="big" id="ovTitle"></div><div class="stars" id="ovStars"></div><div class="sub" id="ovSub"></div><div class="row" id="ovRow"></div></div>
  <div class="overlay" id="ovIntro">
    <div class="ovh" id="inMap"></div>
    <div class="cmdRow" id="inCmd"></div>
    <div class="trLegend" id="inTraits"></div>
    <div class="ovh" id="inGambitsTitle">Твой дебют</div>
    <div class="gambits" id="inGambits"></div>
  </div>
  <div class="overlay" id="ovMenu"><div class="ovh">Карты</div><div class="levels" id="lvlGrid"></div>
    <div class="menuNote" id="menuNote"></div>
    <div class="diffRow" id="diffRow"></div>
    <div class="heroCard" id="heroCard"></div>
    <div class="row"><button class="btn" id="closeMenu">Закрыть</button></div>
    <div class="menuNote">версия 3.1</div></div>
  <button class="rush" id="rushBtn">⚡</button>
  <div class="spec" id="specMenu">
    <button data-s="chibi" title="Пузатики — защита">🛡️</button>
    <button data-s="knight" title="Рыцари — атака">⚔️</button>
    <button data-s="mech" title="Механизмы — осада">🚜</button>
    <button data-s="spirit" title="Духи — Завод/поддержка">✨</button>
  </div>

  <div class="powbar"><div id="powP"></div><div id="powN"></div><div id="powE"></div></div>

  <div id="loading"><div style="font-size:56px">🦉</div>
    <div style="font-size:26px;font-weight:800;letter-spacing:-.5px">Захват</div>
    <div class="spinner"></div><div style="color:#8f97c9;font-size:13px">Готовим карту…</div>
    <div style="color:#565e8c;font-size:11px">версия 3.1</div><div id="err"></div></div>

<!-- SDK Яндекс Игр: на их хостинге /sdk.js существует, на своём сайте просто 404 и игра идёт дальше -->
<script src="/sdk.js" onerror="void 0"></script>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.js",
  "three/addons/": "./vendor/jsm/"
}}
</script>
<script type="module" src="./game.js"></script>
</body>
</html>
