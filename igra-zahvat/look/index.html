<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Захват — сцена-образец</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:#bfe0ef;}
  body{font-family:'Inter',system-ui,sans-serif;}
  #app{position:fixed;inset:0;}
  canvas{display:block;}
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(130% 95% at 50% 40%, rgba(0,0,0,0) 52%, rgba(8,18,28,0.34) 100%);}
  .tag{position:fixed;left:14px;top:12px;z-index:10;color:#fff;font-weight:800;font-size:15px;text-shadow:0 2px 6px rgba(0,0,0,.5);}
  .tag small{display:block;font-weight:600;font-size:12px;opacity:.9;}
  .hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:10;
    background:rgba(15,18,38,.6);color:#eaf0ff;font-size:12.5px;padding:7px 14px;border-radius:999px;backdrop-filter:blur(6px);}
  #loading{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#0f1226,#171a3a);color:#cfe0ff;font-weight:700;}
  #err{position:fixed;inset:0;z-index:41;display:none;align-items:center;justify-content:center;text-align:center;
    background:#1a1020;color:#ffd3da;padding:24px;font-size:14px;}
</style>
</head>
<body>
  <div id="app"></div>
  <div class="vignette"></div>
  <div class="tag">Сцена-образец 🏰<small>реальные модели Quaternius (CC0) + свет/пост Three.js</small></div>
  <div class="hint">Это только проверка вида (не игра). Покрути пальцем/мышью.</div>
  <div id="loading">Загрузка 3D-моделей…</div>
  <div id="err"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';

let renderer, scene, camera, controls, composer;

function sky(){ const c=document.createElement('canvas'); c.width=4; c.height=256; const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,256);
  g.addColorStop(0,'#d8eef8'); g.addColorStop(0.55,'#bfe2f0'); g.addColorStop(1,'#9fcfe6');
  x.fillStyle=g; x.fillRect(0,0,4,256); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t; }

async function init(){
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.1;
  document.getElementById('app').appendChild(renderer.domElement);

  scene=new THREE.Scene(); scene.background=sky(); scene.fog=new THREE.Fog(0xc7e6f2, 28, 65);
  try{ const pm=new THREE.PMREMGenerator(renderer); scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture; }catch(e){}

  camera=new THREE.PerspectiveCamera(36, innerWidth/innerHeight, 0.1, 300);
  camera.position.set(15,10,17);
  controls=new OrbitControls(camera, renderer.domElement);
  controls.target.set(0,1.4,0); controls.enableDamping=true; controls.dampingFactor=0.08;
  controls.autoRotate=true; controls.autoRotateSpeed=0.55; controls.minDistance=10; controls.maxDistance=40;
  controls.maxPolarAngle=Math.PI*0.49;

  // three-point light
  scene.add(new THREE.HemisphereLight(0xeaf3ff,0x55703f,0.55));
  const sun=new THREE.DirectionalLight(0xfff4dd,2.2); sun.position.set(12,20,8); sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048); const sc=sun.shadow.camera;
  sc.left=-22;sc.right=22;sc.top=18;sc.bottom=-18;sc.near=1;sc.far=80; sun.shadow.bias=-0.0004; sun.shadow.radius=4; scene.add(sun);
  const fill=new THREE.DirectionalLight(0xbcd2ff,0.5); fill.position.set(-14,9,-4); scene.add(fill);
  const rim=new THREE.DirectionalLight(0xffffff,1.3); rim.position.set(-8,7,-16); scene.add(rim);

  // ground
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(160,160).rotateX(-Math.PI/2),
    new THREE.MeshStandardMaterial({color:0x6cad4f, roughness:1}));
  ground.receiveShadow=true; scene.add(ground);
  // central plaza (cobble-ish) + simple cross paths
  const plaza=new THREE.Mesh(new THREE.CircleGeometry(5,40).rotateX(-Math.PI/2),
    new THREE.MeshStandardMaterial({color:0xb9a98c, roughness:1}));
  plaza.position.y=0.02; plaza.receiveShadow=true; scene.add(plaza);
  for(const a of [0,Math.PI/2]){ const road=new THREE.Mesh(new THREE.PlaneGeometry(3,40).rotateX(-Math.PI/2),
    new THREE.MeshStandardMaterial({color:0xb3a382, roughness:1})); road.rotation.z=a; road.position.y=0.015; road.receiveShadow=true; scene.add(road); }

  const loader=new GLTFLoader();
  const load=async f=>{ const g=await loader.loadAsync('models/'+f);
    g.scene.traverse(c=>{ if(c.isMesh){ c.castShadow=true; c.receiveShadow=true; if(c.material){ c.material.metalness=0; c.material.roughness=Math.min(1,(c.material.roughness??1)*0.9+0.1);} } }); return g.scene; };

  const houses=await Promise.all([1,2,3,4,5,6].map(i=>load('house'+i+'.glb')));
  const towers=await Promise.all([1,2].map(i=>load('tower'+i+'.glb')));
  const tree=await load('c-tree.glb'), tree2=await load('c-tree2.glb'), rock=await load('c-rock.glb'), rock2=await load('c-rock2.glb');

  // village layout (ring of buildings facing outward toward the orbiting camera)
  const ring=[
    {m:houses[0],x:-6,z:-3,s:1.5},{m:houses[1],x:-7,z:3,s:1.5},{m:houses[2],x:-2.5,z:6.5,s:1.5},
    {m:houses[3],x:3.5,z:6,s:1.5},{m:houses[4],x:7,z:2,s:1.5},{m:houses[5],x:5,z:-4,s:1.5},
    {m:towers[0],x:-1,z:-6.5,s:1.6},{m:towers[1],x:8.5,z:-2,s:1.7},
  ];
  for(const b of ring){ const o=b.m.clone(true); o.position.set(b.x,0,b.z); o.scale.setScalar(b.s);
    o.rotation.y=Math.atan2(b.x,b.z)+Math.PI; scene.add(o); }

  // greenery + rocks around the edges (deterministic)
  let seed=12345; const rng=()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; };
  const greens=[tree,tree2,rock,rock2];
  for(let i=0;i<70;i++){ const ang=rng()*6.28, rad=8+rng()*16; const x=Math.cos(ang)*rad, z=Math.sin(ang)*rad*0.8;
    if(Math.hypot(x,z)<8) continue;
    const r=rng(); const src = r<0.5?tree : r<0.78?tree2 : r<0.9?rock2:rock;
    const o=src.clone(true); o.position.set(x,0,z); o.rotation.y=rng()*6.28; o.scale.setScalar((src===rock||src===rock2?0.8:1.0)+rng()*0.6);
    scene.add(o); }

  // post-processing
  try{
    const rt=new THREE.WebGLRenderTarget(innerWidth,innerHeight,{type:THREE.HalfFloatType});
    composer=new EffectComposer(renderer,rt);
    composer.addPass(new RenderPass(scene,camera));
    try{ composer.addPass(new GTAOPass(scene,camera,innerWidth,innerHeight)); }catch(e){ console.warn('AO',e); }
    composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.28,0.7,0.9));
    composer.addPass(new OutputPass());
    try{ composer.addPass(new SMAAPass(innerWidth,innerHeight)); }catch(e){}
  }catch(e){ composer=null; }

  addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight); if(composer) composer.setSize(innerWidth,innerHeight); });

  document.getElementById('loading').style.display='none';
  renderer.setAnimationLoop(()=>{ controls.update();
    if(composer) composer.render(); else renderer.render(scene,camera); });
}
init().catch(e=>{ console.error(e); document.getElementById('loading').style.display='none';
  const el=document.getElementById('err'); el.style.display='flex';
  el.textContent='Не удалось загрузить сцену: '+(e&&e.message?e.message:e); });
</script>
</body>
</html>
