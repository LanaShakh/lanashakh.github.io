<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Захват — образец (Tower Defense Kit)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:#bfe0ef;}
  body{font-family:'Inter',system-ui,sans-serif;}
  #app{position:fixed;inset:0;} canvas{display:block;}
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(130% 95% at 50% 40%, rgba(0,0,0,0) 52%, rgba(8,18,28,0.32) 100%);}
  .tag{position:fixed;left:14px;top:12px;z-index:10;color:#fff;font-weight:800;font-size:15px;text-shadow:0 2px 6px rgba(0,0,0,.5);}
  .tag small{display:block;font-weight:600;font-size:12px;opacity:.9;}
  .hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:10;
    background:rgba(15,18,38,.6);color:#eaf0ff;font-size:12.5px;padding:7px 14px;border-radius:999px;backdrop-filter:blur(6px);}
  #loading{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#0f1226,#171a3a);color:#cfe0ff;font-weight:700;}
  #err{position:fixed;inset:0;z-index:41;display:none;align-items:center;justify-content:center;text-align:center;
    background:#1a1020;color:#ffd3da;padding:24px;font-size:14px;}
</style>
</head>
<body>
  <div id="app"></div>
  <div class="vignette"></div>
  <div class="tag">Образец: Tower Defense Kit 🗼<small>башни-герои + остров-диорама</small></div>
  <div class="hint">Башни в фокусе. Покрути пальцем/мышью.</div>
  <div id="loading">Сборка локации…</div>
  <div id="err"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';

let renderer, scene, camera, controls, composer;
const TEAM={p:0x3b82f6,e:0xef4444,n:0x9aa3b2};
function sky(){ const c=document.createElement('canvas'); c.width=4;c.height=256; const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,256); g.addColorStop(0,'#a9dcf2'); g.addColorStop(.55,'#8ccbe6'); g.addColorStop(1,'#74b8d8');
  x.fillStyle=g; x.fillRect(0,0,4,256); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t; }
function findMesh(root){ let f=null; root.traverse(o=>{ if(!f&&o.isMesh) f=o; }); return f; }

async function init(){
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.NoToneMapping;   // keep the kit's vibrant baked colors
  document.getElementById('app').appendChild(renderer.domElement);

  scene=new THREE.Scene(); scene.background=sky(); scene.fog=new THREE.Fog(0x9fd0e6, 34, 85);
  let env=null; try{ const pm=new THREE.PMREMGenerator(renderer); env=pm.fromScene(new RoomEnvironment(),0.04).texture; scene.environment=env; }catch(e){}

  camera=new THREE.PerspectiveCamera(33, innerWidth/innerHeight, 0.1, 400);
  camera.position.set(14,11,16);
  controls=new OrbitControls(camera, renderer.domElement);
  controls.target.set(0,1.0,0); controls.enableDamping=true; controls.dampingFactor=0.08;
  controls.autoRotate=true; controls.autoRotateSpeed=0.34; controls.minDistance=9; controls.maxDistance=46; controls.maxPolarAngle=Math.PI*0.49;

  // softer, balanced light (no blow-out -> colors stay saturated)
  scene.add(new THREE.HemisphereLight(0xdfeeff,0x5c7a42,0.5));
  const sun=new THREE.DirectionalLight(0xfff1d6,1.55); sun.position.set(12,20,8); sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048); const sc=sun.shadow.camera;
  sc.left=-22;sc.right=22;sc.top=18;sc.bottom=-18;sc.near=1;sc.far=85; sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.04; sun.shadow.radius=4; scene.add(sun);
  const fill=new THREE.DirectionalLight(0xbcd2ff,0.32); fill.position.set(-15,9,-4); scene.add(fill);
  const rim=new THREE.DirectionalLight(0xffffff,0.7); rim.position.set(-8,8,-16); scene.add(rim);

  const loader=new GLTFLoader();
  const load=async f=>{ const g=await loader.loadAsync('models/'+f);
    g.scene.traverse(c=>{ if(c.isMesh){ c.castShadow=true; c.receiveShadow=true;
      if(c.material){ c.material.metalness=0; c.material.envMapIntensity=0.55; } } }); return g.scene; };
  const N={ tile:'tile.glb', dirt:'tile-dirt.glb', hill:'tile-hill.glb',
    tree:'detail-tree.glb', treeL:'detail-tree-large.glb', rocks:'detail-rocks.glb', crystal:'detail-crystal.glb',
    structure:'wood-structure-high.glb', tb:'tower-round-build-b.glb', tc:'tower-round-build-c.glb', td:'tower-round-build-d.glb', tf:'tower-round-build-f.glb' };
  const M={}; await Promise.all(Object.entries(N).map(async([k,f])=>{ M[k]=await load(f); }));
  const tmesh=findMesh(M.tile); tmesh.geometry.computeBoundingBox(); const bb=tmesh.geometry.boundingBox;
  const TOP=bb.max.y, TH=bb.max.y-bb.min.y;   // tile top, tile height (for stacking elevation)

  let s=20240604; const rng=()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; };

  // ---------- island as an irregular blob (in the sea) ----------
  const COLS=14, ROWS=11, ox=(COLS-1)/2, oz=(ROWS-1)/2;
  const land={}, isLand=(cx,cz)=>land[cx+','+cz];
  for(let cx=0;cx<COLS;cx++) for(let cz=0;cz<ROWS;cz++){
    const dx=(cx-ox)/(COLS*0.46), dz=(cz-oz)/(ROWS*0.46);
    if(dx*dx+dz*dz < 0.85 + (rng()-0.5)*0.18) land[cx+','+cz]=true;
  }
  const put=(m,cx,cz,y,ry=0,sc=1)=>{ const o=m.clone(true); o.position.set(cx-ox,y,cz-oz); o.rotation.y=ry; o.scale.setScalar(sc); scene.add(o); return o; };

  // winding dirt path
  const onPath=(cx,cz)=> cx===Math.round(ox + 2.4*Math.sin(cz*0.6));
  // raised plateau region (a corner cluster)
  const onPlateau=(cx,cz)=> isLand(cx,cz) && cx>=COLS-5 && cz<=4;

  for(let cx=0;cx<COLS;cx++) for(let cz=0;cz<ROWS;cz++){
    if(!isLand(cx,cz)) continue;
    const base = onPath(cx,cz)? M.dirt : M.tile;
    put(base,cx,cz,0);
    if(onPlateau(cx,cz)) put(M.tile,cx,cz,TOP);   // second layer -> cliff/plateau
  }
  const groundY=(cx,cz)=> onPlateau(cx,cz)? TOP+TH : TOP;

  // sea
  const sea=new THREE.Mesh(new THREE.PlaneGeometry(300,300).rotateX(-Math.PI/2),
    new THREE.MeshStandardMaterial({color:0x3aa0d6, roughness:0.35, metalness:0.0}));
  sea.position.y=TOP*0.45; scene.add(sea);

  // ---------- TOWERS = heroes (level growth b->c->d->f), team rings ----------
  const used=new Set();
  const heroes=[ {m:M.tb,cx:4,cz:7,t:'p',s:1.0}, {m:M.tc,cx:6,cz:8,t:'p',s:1.06},
                 {m:M.td,cx:5,cz:5,t:'n',s:1.12},
                 {m:M.tf,cx:COLS-3,cz:2,t:'e',s:1.2} /* on plateau */, {m:M.tc,cx:COLS-2,cz:4,t:'e',s:1.06} ];
  for(const h of heroes){ if(!isLand(h.cx,h.cz)) continue; used.add(h.cx+','+h.cz);
    const gy=groundY(h.cx,h.cz);
    put(h.m,h.cx,h.cz,gy,0,h.s);
    const ring=new THREE.Mesh(new THREE.TorusGeometry(0.52,0.075,12,40).rotateX(Math.PI/2),
      new THREE.MeshStandardMaterial({color:TEAM[h.t], emissive:TEAM[h.t], emissiveIntensity:0.5, roughness:0.5}));
    ring.position.set(h.cx-ox, gy+0.05, h.cz-oz); ring.scale.setScalar(h.s); scene.add(ring);
  }
  // a wood structure landmark on the plateau edge
  put(M.structure, COLS-4, 1, groundY(COLS-4,1), 0.4, 1.0); used.add((COLS-4)+',1');

  // ---------- clustered decor (groves / rock piles / crystals) ----------
  const clusters=[ {x:2,z:3,k:'tree',n:5}, {x:3,z:9,k:'tree',n:4}, {x:9,z:9,k:'tree',n:5},
                   {x:7,z:2,k:'rock',n:3}, {x:11,z:7,k:'crystal',n:4}, {x:2,z:6,k:'rock',n:3} ];
  for(const cl of clusters){ for(let i=0;i<cl.n;i++){
    const cx=cl.x+Math.round((rng()-0.5)*2.2), cz=cl.z+Math.round((rng()-0.5)*2.2);
    if(!isLand(cx,cz)||used.has(cx+','+cz)||onPath(cx,cz)) continue;
    const m = cl.k==='tree'? (rng()<0.5?M.tree:M.treeL) : cl.k==='rock'? M.rocks : M.crystal;
    put(m,cx,cz,groundY(cx,cz),rng()*6.28, (cl.k==='tree'?0.85:0.8)+rng()*0.4);
  }}

  // ---------- post ----------
  try{
    const rt=new THREE.WebGLRenderTarget(innerWidth,innerHeight,{type:THREE.HalfFloatType, samples:8});
    composer=new EffectComposer(renderer,rt);
    composer.addPass(new RenderPass(scene,camera));
    try{ composer.addPass(new GTAOPass(scene,camera,innerWidth,innerHeight)); }catch(e){ console.warn('AO',e); }
    composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.12,0.6,0.96));
    composer.addPass(new OutputPass());
    try{ composer.addPass(new SMAAPass(innerWidth,innerHeight)); }catch(e){}
  }catch(e){ composer=null; }

  addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight); if(composer) composer.setSize(innerWidth,innerHeight); });

  document.getElementById('loading').style.display='none';
  renderer.setAnimationLoop(()=>{ controls.update(); if(composer) composer.render(); else renderer.render(scene,camera); });
}
init().catch(e=>{ console.error(e); document.getElementById('loading').style.display='none';
  const el=document.getElementById('err'); el.style.display='flex'; el.textContent='Ошибка сцены: '+(e&&e.message?e.message:e); });
</script>
</body>
</html>
