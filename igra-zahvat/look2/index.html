<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Захват — образец (retro fantasy)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:#bfe0ef;}
  body{font-family:'Inter',system-ui,sans-serif;}
  #app{position:fixed;inset:0;} canvas{display:block;}
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(130% 95% at 50% 40%, rgba(0,0,0,0) 52%, rgba(8,18,28,0.34) 100%);}
  .tag{position:fixed;left:14px;top:12px;z-index:10;color:#fff;font-weight:800;font-size:15px;text-shadow:0 2px 6px rgba(0,0,0,.5);}
  .tag small{display:block;font-weight:600;font-size:12px;opacity:.9;}
  .hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:10;
    background:rgba(15,18,38,.6);color:#eaf0ff;font-size:12.5px;padding:7px 14px;border-radius:999px;backdrop-filter:blur(6px);}
  #loading{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#0f1226,#171a3a);color:#cfe0ff;font-weight:700;}
  #err{position:fixed;inset:0;z-index:41;display:none;align-items:center;justify-content:center;text-align:center;
    background:#1a1020;color:#ffd3da;padding:24px;font-size:14px;}
</style>
</head>
<body>
  <div id="app"></div>
  <div class="vignette"></div>
  <div class="tag">Образец: Retro Fantasy 🏯<small>модульная крепость Kenney (CC0) + свет/пост</small></div>
  <div class="hint">Только проверка вида. Покрути пальцем/мышью.</div>
  <div id="loading">Сборка крепости…</div>
  <div id="err"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';

let renderer, scene, camera, controls, composer;
function sky(){ const c=document.createElement('canvas'); c.width=4; c.height=256; const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,256);
  g.addColorStop(0,'#bfe4f6'); g.addColorStop(0.55,'#a9d6ec'); g.addColorStop(1,'#8fc4de');
  x.fillStyle=g; x.fillRect(0,0,4,256); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t; }

async function init(){
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.1;
  document.getElementById('app').appendChild(renderer.domElement);

  scene=new THREE.Scene(); scene.background=sky(); scene.fog=new THREE.Fog(0xa9d6ec, 34, 80);
  try{ const pm=new THREE.PMREMGenerator(renderer); scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture; }catch(e){}

  camera=new THREE.PerspectiveCamera(36, innerWidth/innerHeight, 0.1, 400);
  camera.position.set(20,14,22);
  controls=new OrbitControls(camera, renderer.domElement);
  controls.target.set(0,2,0); controls.enableDamping=true; controls.dampingFactor=0.08;
  controls.autoRotate=true; controls.autoRotateSpeed=0.4; controls.minDistance=12; controls.maxDistance=55; controls.maxPolarAngle=Math.PI*0.49;

  scene.add(new THREE.HemisphereLight(0xeaf3ff,0x5a7a40,0.55));
  const sun=new THREE.DirectionalLight(0xfff0d2,2.3); sun.position.set(14,22,9); sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048); const sc=sun.shadow.camera;
  sc.left=-26;sc.right=26;sc.top=22;sc.bottom=-22;sc.near=1;sc.far=90; sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.04; sun.shadow.radius=4; scene.add(sun);
  const fill2=new THREE.DirectionalLight(0xbcd2ff,0.5); fill2.position.set(-16,9,-5); scene.add(fill2);
  const rim2=new THREE.DirectionalLight(0xffffff,1.25); rim2.position.set(-9,8,-18); scene.add(rim2);

  // lush ground (colors from reference)
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200).rotateX(-Math.PI/2),
    new THREE.MeshStandardMaterial({color:0x77b94e, roughness:1}));
  ground.receiveShadow=true; scene.add(ground);

  const loader=new GLTFLoader();
  const load=async f=>{ const g=await loader.loadAsync('models/'+f);
    g.scene.traverse(c=>{ if(c.isMesh){ c.castShadow=true; c.receiveShadow=true; if(c.material){ c.material.metalness=0; c.material.roughness=Math.min(1,(c.material.roughness??1)); } } }); return g.scene; };
  const M={};
  const names={ wall:'wall-fortified.glb', gate:'wall-fortified-gate.glb', batt:'battlement.glb',
    tbase:'tower-base.glb', tower:'tower.glb', ttop:'tower-top.glb', paint:'tower-paint.glb',
    floor:'floor.glb', barrel:'detail-barrel.glb', crate:'detail-crate.glb',
    treeL:'tree-large.glb', shrub:'tree-shrub.glb', fence:'fence-wood.glb' };
  await Promise.all(Object.entries(names).map(async([k,f])=>{ M[k]=await load(f); }));

  // ---- assemble fortress on a 1-unit grid ----
  const fort=new THREE.Group();
  const add=(m,x,y,z,ry,s=1)=>{ const o=m.clone(true); o.position.set(x,y,z); o.rotation.y=ry; o.scale.setScalar(s); fort.add(o); };
  const H=3;
  for(let i=-2;i<=2;i++){
    add(i===0?M.gate:M.wall, i,0,-H, 0);            add(M.batt, i,1,-H, 0);
    add(M.wall, i,0,H, Math.PI);                    add(M.batt, i,1,H, Math.PI);
    add(M.wall, -H,0,i, -Math.PI/2);                add(M.batt, -H,1,i, -Math.PI/2);
    add(M.wall, H,0,i, Math.PI/2);                  add(M.batt, H,1,i, Math.PI/2);
  }
  for(const [cx,cz] of [[-H,-H],[H,-H],[-H,H],[H,H]]){ add(M.tbase,cx,0,cz,0); add(M.tower,cx,1,cz,0); add(M.ttop,cx,2,cz,0); }
  // central keep (taller, painted accent)
  add(M.tbase,0,0,0,0); add(M.paint,0,1,0,0); add(M.paint,0,2,0,0); add(M.ttop,0,3,0,0);
  // courtyard
  for(let x=-2;x<=2;x++) for(let z=-2;z<=2;z++) add(M.floor,x,0,z,0);
  // props
  add(M.barrel,-1.6,0,-1.2,0); add(M.barrel,-1.3,0,-1.6,0.6); add(M.crate,1.7,0,1.3,0.3); add(M.crate,1.3,0,1.7,-0.4);
  fort.scale.setScalar(1.6); scene.add(fort);

  // trees/shrubs around the fortress
  let s=98765; const rng=()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; };
  for(let i=0;i<60;i++){ const ang=rng()*6.28, rad=10+rng()*16; const x=Math.cos(ang)*rad, z=Math.sin(ang)*rad*0.85;
    const o=(rng()<0.6?M.treeL:M.shrub).clone(true); o.position.set(x,0,z); o.rotation.y=rng()*6.28; o.scale.setScalar(1.4+rng()*0.9); scene.add(o); }

  try{
    const rt=new THREE.WebGLRenderTarget(innerWidth,innerHeight,{type:THREE.HalfFloatType, samples:8});
    composer=new EffectComposer(renderer,rt);
    composer.addPass(new RenderPass(scene,camera));
    try{ composer.addPass(new GTAOPass(scene,camera,innerWidth,innerHeight)); }catch(e){ console.warn('AO',e); }
    composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.16,0.6,0.95));
    composer.addPass(new OutputPass());
    try{ composer.addPass(new SMAAPass(innerWidth,innerHeight)); }catch(e){}
  }catch(e){ composer=null; }

  addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight); if(composer) composer.setSize(innerWidth,innerHeight); });

  document.getElementById('loading').style.display='none';
  renderer.setAnimationLoop(()=>{ controls.update(); if(composer) composer.render(); else renderer.render(scene,camera); });
}
init().catch(e=>{ console.error(e); document.getElementById('loading').style.display='none';
  const el=document.getElementById('err'); el.style.display='flex'; el.textContent='Ошибка сцены: '+(e&&e.message?e.message:e); });
</script>
</body>
</html>
