<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#79c95f"/>
      <stop offset="1" stop-color="#4f9e44"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a2a0a" stop-opacity="0.28"/>
    </radialGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fb0ff"/>
      <stop offset="0.5" stop-color="#2f6fe0"/>
      <stop offset="1" stop-color="#1c47a6"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a9d"/>
      <stop offset="0.5" stop-color="#e23b4e"/>
      <stop offset="1" stop-color="#a82236"/>
    </linearGradient>
    <linearGradient id="grey" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c7cdd9"/>
      <stop offset="0.5" stop-color="#9298ad"/>
      <stop offset="1" stop-color="#6c7283"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6fe0"/>
      <stop offset="1" stop-color="#7fb6ff"/>
    </linearGradient>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#103a10" flood-opacity="0.30"/>
    </filter>
    <filter id="blurS" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- ground -->
  <rect width="760" height="520" fill="url(#grass)"/>
  <!-- organic darker patches -->
  <g fill="#4d9a44" opacity="0.55">
    <ellipse cx="160" cy="170" rx="150" ry="80"/>
    <ellipse cx="600" cy="120" rx="170" ry="70"/>
    <ellipse cx="430" cy="470" rx="220" ry="90"/>
  </g>
  <!-- light winding path -->
  <path d="M40 470 Q 250 360 420 410 T 730 300" fill="none" stroke="#8ed47a" stroke-width="26" stroke-linecap="round" opacity="0.5"/>
  <!-- grass tufts + flowers -->
  <g stroke="#3f8a37" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <path d="M90 300 l4 -12 M97 300 l0 -14 M104 300 l4 -12"/>
    <path d="M300 180 l4 -12 M307 180 l0 -14 M314 180 l4 -12"/>
    <path d="M540 470 l4 -12 M547 470 l0 -14 M554 470 l4 -12"/>
    <path d="M660 200 l4 -12 M667 200 l0 -14 M674 200 l4 -12"/>
  </g>
  <g>
    <circle cx="250" cy="470" r="4" fill="#ffd35a"/><circle cx="262" cy="476" r="4" fill="#fff"/>
    <circle cx="500" cy="150" r="4" fill="#ff8fb0"/><circle cx="512" cy="156" r="4" fill="#fff"/>
  </g>

  <!-- connection ribbon (player -> neutral), drawn under towers -->
  <g>
    <path d="M250 320 Q 360 270 452 256" fill="none" stroke="#16357f" stroke-width="22" stroke-linecap="round"/>
    <path d="M250 320 Q 360 270 452 256" fill="none" stroke="url(#ribbon)" stroke-width="16" stroke-linecap="round"/>
    <!-- chevrons -->
    <g fill="#ffffff" opacity="0.7">
      <path d="M300 300 l9 4 l-9 4 l3 -4 z"/>
      <path d="M345 286 l9 4 l-9 4 l3 -4 z"/>
      <path d="M390 272 l9 4 l-9 4 l3 -4 z"/>
    </g>
    <!-- arrowhead -->
    <path d="M452 256 l-16 -8 l4 8 l-4 8 z" fill="#9fc6ff"/>
  </g>

  <!-- ===== trees (back) ===== -->
  <g>
    <ellipse cx="560" cy="158" rx="26" ry="9" fill="#1f5d1f" opacity="0.3" filter="url(#blurS)"/>
    <rect x="555" y="135" width="10" height="26" rx="4" fill="#7a5230"/>
    <circle cx="560" cy="120" r="24" fill="#2f8a3c"/><circle cx="544" cy="132" r="17" fill="#2f8a3c"/><circle cx="576" cy="132" r="17" fill="#2f8a3c"/>
    <circle cx="552" cy="110" r="13" fill="#57c45f"/>
  </g>

  <!-- ===== NEUTRAL tower (back) ===== -->
  <g>
    <ellipse cx="470" cy="258" rx="44" ry="15" fill="#0c2a0c" opacity="0.28" filter="url(#blurS)"/>
    <ellipse cx="470" cy="252" rx="34" ry="12" fill="#6c7283"/>
    <path d="M436 252 L444 168 Q470 156 496 168 L504 252 Z" fill="url(#grey)"/>
    <path d="M436 252 L444 168 Q455 162 470 159 L470 252 Z" fill="#ffffff" opacity="0.12"/>
    <path d="M444 188 L496 188 L494 200 L446 200 Z" fill="#ffd35a" opacity="0.85"/>
    <ellipse cx="470" cy="168" rx="26" ry="9" fill="#c7cdd9"/>
    <ellipse cx="470" cy="168" rx="26" ry="9" fill="none" stroke="#5b6072" stroke-width="2"/>
    <line x1="470" y1="168" x2="470" y2="132" stroke="#5b6072" stroke-width="3"/>
    <path d="M470 132 L494 139 L470 146 Z" fill="#9298ad"/>
    <g filter="url(#soft)">
      <circle cx="470" cy="206" r="19" fill="#fff"/>
      <circle cx="470" cy="206" r="19" fill="none" stroke="#6c7283" stroke-width="3"/>
      <text x="470" y="213" text-anchor="middle" font-size="22" font-weight="800" fill="#525868">8</text>
    </g>
  </g>

  <!-- ===== PLAYER tower (front) ===== -->
  <g>
    <ellipse cx="210" cy="372" rx="64" ry="20" fill="#0c2a0c" opacity="0.30" filter="url(#blurS)"/>
    <ellipse cx="210" cy="362" rx="46" ry="16" fill="#1c47a6"/>
    <path d="M164 362 L176 222 Q210 206 244 222 L256 362 Z" fill="url(#blue)"/>
    <path d="M164 362 L176 222 Q192 212 210 209 L210 362 Z" fill="#ffffff" opacity="0.15"/>
    <path d="M176 250 L244 250 L241 266 L179 266 Z" fill="#ffd35a"/>
    <ellipse cx="210" cy="222" rx="34" ry="12" fill="#6fb0ff"/>
    <ellipse cx="210" cy="222" rx="34" ry="12" fill="none" stroke="#19408f" stroke-width="2"/>
    <line x1="210" y1="222" x2="210" y2="176" stroke="#19408f" stroke-width="3.5"/>
    <path d="M210 176 L242 186 L210 196 Z" fill="#2f6fe0"/>
    <circle cx="210" cy="176" r="4" fill="#ffd35a"/>
    <g filter="url(#soft)">
      <circle cx="210" cy="270" r="23" fill="#fff"/>
      <circle cx="210" cy="270" r="23" fill="none" stroke="#2f6fe0" stroke-width="3.5"/>
      <text x="210" y="279" text-anchor="middle" font-size="27" font-weight="800" fill="#1f4fb0">24</text>
    </g>
  </g>

  <!-- ===== ENEMY tower (front) ===== -->
  <g>
    <ellipse cx="600" cy="392" rx="58" ry="18" fill="#0c2a0c" opacity="0.30" filter="url(#blurS)"/>
    <ellipse cx="600" cy="382" rx="42" ry="15" fill="#a82236"/>
    <path d="M558 382 L568 252 Q600 236 632 252 L642 382 Z" fill="url(#red)"/>
    <path d="M558 382 L568 252 Q583 243 600 240 L600 382 Z" fill="#ffffff" opacity="0.15"/>
    <path d="M568 278 L632 278 L629 294 L571 294 Z" fill="#ffd35a"/>
    <ellipse cx="600" cy="252" rx="32" ry="11" fill="#ff8a9d"/>
    <ellipse cx="600" cy="252" rx="32" ry="11" fill="none" stroke="#8c1c2d" stroke-width="2"/>
    <line x1="600" y1="252" x2="600" y2="208" stroke="#8c1c2d" stroke-width="3.5"/>
    <path d="M600 208 L631 218 L600 228 Z" fill="#e23b4e"/>
    <g filter="url(#soft)">
      <circle cx="600" cy="298" r="21" fill="#fff"/>
      <circle cx="600" cy="298" r="21" fill="none" stroke="#e23b4e" stroke-width="3.5"/>
      <text x="600" y="306" text-anchor="middle" font-size="25" font-weight="800" fill="#a82236">17</text>
    </g>
  </g>

  <!-- ===== trees + rock (front) ===== -->
  <g>
    <ellipse cx="110" cy="440" rx="30" ry="10" fill="#1f5d1f" opacity="0.3" filter="url(#blurS)"/>
    <rect x="104" y="414" width="12" height="30" rx="5" fill="#7a5230"/>
    <circle cx="110" cy="398" r="28" fill="#2f8a3c"/><circle cx="91" cy="412" r="20" fill="#2f8a3c"/><circle cx="129" cy="412" r="20" fill="#2f8a3c"/>
    <circle cx="100" cy="386" r="15" fill="#57c45f"/>
  </g>
  <g>
    <ellipse cx="390" cy="430" rx="34" ry="11" fill="#1f5d1f" opacity="0.28" filter="url(#blurS)"/>
    <circle cx="385" cy="420" r="20" fill="#9aa0ac"/><circle cx="404" cy="426" r="13" fill="#9aa0ac"/>
    <circle cx="378" cy="414" r="7" fill="#c2c7d1" opacity="0.7"/>
  </g>

  <rect width="760" height="520" fill="url(#vign)"/>
</svg>
