<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f3ead8">
<title>Сад камней — медитативная головоломка</title>
<meta name="description" content="Сад камней — сдвигай камень свайпом, он скользит до упора и боронит песок. Проборони весь дзен-сад. Спокойная логическая игра без таймеров.">
<!-- SDK Яндекс Игр: вне платформы просто 404 и всё работает как обычно -->
<script src="/sdk.js" onerror="void 0"></script>
<style>
  :root{
    --ink:#3a332a; --muted:#8a7c66;
    --panel:rgba(74,62,45,.09); --panel2:rgba(74,62,45,.16);
    --gold:#b3822e;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:ui-rounded,'Nunito','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
    background:#ddcdae; color:var(--ink); user-select:none; -webkit-user-select:none;
    display:flex; align-items:center; justify-content:center; height:100%;
  }
  #wrap{
    position:relative; overflow:hidden; border-radius:0;
    width:min(100vw, calc(100dvh * 120 / 208));
    height:min(100dvh, calc(100vw * 208 / 120));
    background:linear-gradient(180deg,#f7f0e0 0%,#f3ead8 48%,#e9dcc3 100%);
    touch-action:none;
  }
  @media (min-width:520px){ #wrap{border-radius:20px; box-shadow:0 20px 60px rgba(88,66,38,.35);} }
  canvas#board{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none;}

  /* ── HUD ── */
  .hud{
    position:absolute; top:0; left:0; right:0; z-index:10;
    display:flex; align-items:center; gap:8px;
    padding:calc(8px + env(safe-area-inset-top)) 10px 6px;
    pointer-events:none;
  }
  .hud > *{pointer-events:auto;}
  .btn{
    border:0; border-radius:14px; background:var(--panel); color:var(--ink);
    font:inherit; font-weight:800; font-size:15px; padding:9px 13px; cursor:pointer;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }
  .btn:active{transform:scale(.95);}
  .btn.primary{background:linear-gradient(135deg,#c39a5d,#a97e42); color:#fff8e8; box-shadow:0 8px 24px rgba(150,110,55,.35);}
  .btn.big{font-size:19px; padding:14px 26px; border-radius:18px;}
  .lvl-name{font-weight:800; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; text-align:center;}
  .lvl-name small{display:block; font-weight:700; font-size:10.5px; color:var(--muted);}

  .subhud{
    position:absolute; top:calc(52px + env(safe-area-inset-top)); left:10px; right:10px; z-index:10;
    display:flex; align-items:center; gap:10px; pointer-events:none;
  }
  .subhud > *{pointer-events:auto;}
  #btnUndo{font-size:13px; padding:8px 12px;}
  #btnUndo:disabled{opacity:.4;}
  .progresswrap{flex:1; height:8px; border-radius:99px; background:rgba(74,62,45,.14); overflow:hidden; pointer-events:none;}
  #rakebar{height:100%; width:0%; border-radius:99px; background:linear-gradient(90deg,#c9a05e,#a97e42); transition:width .2s;}
  #movesTxt{font-weight:800; font-size:13px; white-space:nowrap; color:var(--ink); pointer-events:none;}
  #movesTxt .par{color:var(--muted);}

  /* ── экраны ── */
  .screen{
    position:absolute; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; text-align:center;
    background:rgba(243,234,216,.88); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    padding:24px; transition:opacity .25s;
  }
  .screen.hide{opacity:0; pointer-events:none;}
  h1{font-size:42px; letter-spacing:-1px; line-height:1.05; color:var(--ink); font-weight:800;}
  h1 small{display:block; font-size:15px; letter-spacing:6px; color:var(--muted); font-weight:700; margin-top:6px;}
  .tagline{color:var(--muted); font-weight:700; font-size:15px; max-width:290px; line-height:1.45;}
  .lvlgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; width:min(320px,84%); margin-top:6px;}
  .chip{
    border:0; border-radius:14px; background:var(--panel); color:var(--ink);
    font:inherit; font-weight:800; font-size:16px; padding:10px 0 6px; cursor:pointer;
  }
  .chip small{display:block; font-size:11px; letter-spacing:2px; color:var(--gold); min-height:14px;}
  .chip:disabled{opacity:.35;}
  .chip:active:not(:disabled){transform:scale(.94);}
  #resStars{font-size:46px; letter-spacing:6px; color:var(--gold); text-shadow:0 6px 24px rgba(179,130,46,.3);}
  #resTitle{font-size:30px; font-weight:800;}
  #resMoves{font-size:17px; font-weight:800; color:var(--muted);}
  .row{display:flex; gap:10px;}
  .hint{
    position:absolute; left:50%; bottom:calc(26px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:9;
    background:rgba(58,51,42,.82); color:#f7f0e0; border-radius:16px; padding:12px 16px;
    font-weight:800; font-size:14px; max-width:82%; text-align:center; pointer-events:none;
    transition:opacity .4s; line-height:1.4;
  }
  .hint.hide{opacity:0;}
  .foot{position:absolute; bottom:14px; color:var(--muted); font-size:11.5px; font-weight:700;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="board"></canvas>

  <!-- игровой HUD -->
  <div class="hud" id="hud" style="display:none">
    <button class="btn" id="btnMenu">☰</button>
    <div class="lvl-name" id="lvlName">Уровень 1<small>Первые борозды</small></div>
    <button class="btn" id="btnSnd">🔊</button>
    <button class="btn" id="btnRestart">↺</button>
  </div>
  <div class="subhud" id="subhud" style="display:none">
    <button class="btn" id="btnUndo">↶ Отмена</button>
    <div class="progresswrap"><div id="rakebar"></div></div>
    <div id="movesTxt">Ходы: 0 <span class="par">· цель 5</span></div>
  </div>
  <div class="hint hide" id="hint"></div>

  <!-- меню -->
  <div class="screen" id="menu">
    <h1>Сад камней<small>КАРЭСАНСУЙ</small></h1>
    <div class="tagline">Проведи пальцем — камень скользит по песку до упора и оставляет борозды. Проборони весь сад</div>
    <button class="btn primary big" id="btnPlay">Играть</button>
    <div class="lvlgrid" id="lvlgrid"></div>
    <div class="foot">без таймеров · играется одним пальцем</div>
  </div>

  <!-- результат -->
  <div class="screen hide" id="result">
    <div id="resStars">★★★</div>
    <div id="resTitle">Сад ухожен</div>
    <div id="resMoves">Ходов: 5 · цель 5</div>
    <div class="row">
      <button class="btn big" id="btnAgain">Ещё раз</button>
      <button class="btn primary big" id="btnNext">Дальше</button>
    </div>
    <button class="btn" id="btnResMenu">В меню</button>
  </div>
</div>

<script>
'use strict';
/* ═══════════ «Сад камней» — дзен-головоломка со скользящим камнем ═══════════
   Клетки: '.' песок, '#' валун, ' ' вне сада, 'S' песок + старт камня.
   Свайп → камень скользит до упора; пройденные клетки проборонены.
   Победа: проборонены все песчаные клетки. */

/* ── уровни (сгенерированы и проверены решателем; par = минимум ходов) ── */
const LEVELS = [
  { name:'Первые борозды', par:5, map:[
    "....#",
    ".. . ",
    "....#",
    "#S # ",
  ]},
  { name:'Тихий уголок', par:6, map:[
    "#     ",
    "....# ",
    ".  .# ",
    ".....#",
    "...S.#",
  ]},
  { name:'Тропа к пруду', par:7, map:[
    ".#    ",
    "S     ",
    ".     ",
    ".   # ",
    ".   ..",
    ".   ..",
    "......",
    ".....#",
  ]},
  { name:'Обход валуна', par:8, map:[
    "......",
    ".#  .#",
    ".# #..",
    ".   #S",
    ".#   .",
    ".    .",
    ".    .",
    "......",
    "#  # #",
  ]},
  { name:'Утренний туман', par:9, map:[
    ".......#",
    ".#    #.",
    "........",
    "........",
    "#   # .#",
    "    S..#",
    "      ##",
  ]},
  { name:'Две дорожки', par:10, map:[
    "  ..#..",
    "  .. ..",
    "# .. ..",
    "..S....",
    ".  # #.",
    ".     .",
    ".# # #.",
    ".......",
  ]},
  { name:'Сад лепестков', par:11, map:[
    ".# S   ",
    ".  .  #",
    ".  .  .",
    ".  .  .",
    ".#..# .",
    ". .#...",
    "... . .",
    ". # . .",
    ".....#.",
  ]},
  { name:'Каменный ручей', par:13, map:[
    "  #...#",
    "   . ..",
    "   . ..",
    "#  .#..",
    "....#S.",
    ".  . ..",
    ".  ..# ",
    ".  #. #",
    ".......",
  ]},
  { name:'Лунная поляна', par:14, map:[
    " #S...",
    " .....",
    "#.. ..",
    " .. ..",
    " ..#..",
    "#.....",
    "  ....",
    "  #...",
    "   ..#",
  ]},
  { name:'Терпение', par:15, map:[
    "# #...",
    "..#.S.",
    ".. . .",
    "......",
    "#. # #",
    "..   #",
    ".#....",
    ". . #.",
    "......",
  ]},
  { name:'Путь монаха', par:16, map:[
    "..#    #",
    "...S #..",
    "..   ...",
    "........",
    "#.   .. ",
    "#.   ..#",
    "..#  .. ",
    "..# #.. ",
  ]},
  { name:'Шёпот гравия', par:17, map:[
    "S..# ..",
    ".#.....",
    "#.....#",
    " ..  . ",
    " ..  . ",
    " .. #.#",
    " ..  . ",
    "#..# .#",
    "  #....",
  ]},
  { name:'Долгая осень', par:18, map:[
    "......",
    "......",
    "# .   ",
    "  .   ",
    "  .   ",
    "  .#  ",
    " #..  ",
    "#.#. #",
    "......",
    ".. . S",
    "..#...",
  ]},
  { name:'Совершенство', par:19, map:[
    "......",
    ".  ...",
    ". #...",
    ".....#",
    ".  #.#",
    ".#  . ",
    "S.# . ",
    "#.. .#",
    "...#..",
  ]},
];

const DIRS = { U:[0,-1], R:[1,0], D:[0,1], L:[-1,0] };
const DKEYS = ['U','R','D','L'];

/* ── состояние ── */
let mode = 'menu';            // menu | play
let levelIdx = 0;
let gw = 0, gh = 0, cells = []; // строки карты
let rock = { x:0, y:0 };
let rakedDir = null;          // Int8Array gw*gh: -1 нет, 0..3 направление борозды
let sandTotal = 0;
let moves = 0, won = false;
let undoStack = [];
let anim = null;              // {path, d, t0, dur}
/* геометрия отрисовки */
let cs = 0, ox = 0, oy = 0;   // размер клетки, смещение сада
let base = null;              // офскрин с песком/валунами/текстурой

const $ = id => document.getElementById(id);
const wrap = $('wrap'), cvs = $('board'), ctx = cvs.getContext('2d');
let DPR = 1, CW = 0, CH = 0;

const stars = JSON.parse(localStorage.getItem('sad_stars') || '[]');
let sndOn = localStorage.getItem('sad_snd') !== '0';

/* ── детерминированный шум для текстур ── */
function hash(a, b){
  let x = (a * 374761393 + b * 668265263) | 0;
  x = Math.imul(x ^ x >>> 13, 1274126177);
  return ((x ^ x >>> 16) >>> 0) / 4294967296;
}

/* ═══════════ звук (WebAudio, без файлов) ═══════════ */
let AC = null;
function audio(){ if (!AC) try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} return AC; }
let noiseBuf = null;
function getNoise(){
  if (!noiseBuf && audio()){
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return noiseBuf;
}
function slideSnd(durMs){
  if (!sndOn || !audio() || !getNoise()) return;
  if (AC.state === 'suspended') AC.resume();
  const t = AC.currentTime, dur = durMs / 1000 + .08;
  const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1900; lp.Q.value = .4;
  const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 420;
  const g = AC.createGain();
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(.09, t + .03);
  g.gain.setValueAtTime(.09, t + Math.max(.03, dur - .07));
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  src.connect(hp).connect(lp).connect(g).connect(AC.destination);
  src.start(t); src.stop(t + dur + .02);
}
function thudSnd(){
  if (!sndOn || !audio()) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(120, t);
  o.frequency.exponentialRampToValueAtTime(58, t + .1);
  g.gain.setValueAtTime(.12, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + .13);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + .15);
}
function winSnd(){
  if (!sndOn || !audio()) return;
  [392, 523, 587, 784].forEach((f, i) => {
    const t = AC.currentTime + i * .16;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(.09, t + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t + .8);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + .85);
  });
}

/* ═══════════ модель ═══════════ */
const isSand = (x, y) => x >= 0 && x < gw && y >= 0 && y < gh &&
  (cells[y][x] === '.' || cells[y][x] === 'S');

function computeSlide(x, y, dk){
  const [dx, dy] = DIRS[dk];
  const path = [{ x, y }];
  while (isSand(x + dx, y + dy)){ x += dx; y += dy; path.push({ x, y }); }
  return path;
}
function rakedCount(){
  let n = 0;
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++)
    if (isSand(x, y) && rakedDir[y * gw + x] >= 0) n++;
  return n;
}
function checkWin(){
  if (won || rakedCount() < sandTotal) return;
  won = true;
  const par = LEVELS[levelIdx].par;
  const st = moves <= par ? 3 : moves <= par + 2 ? 2 : 1;
  if (st > (stars[levelIdx] || 0)){
    stars[levelIdx] = st;
    localStorage.setItem('sad_stars', JSON.stringify(stars));
  }
  $('resStars').textContent = '★★★'.slice(0, st);
  $('resTitle').textContent = st === 3 ? 'Безупречно!' : st === 2 ? 'Прекрасно' : 'Сад ухожен';
  $('resMoves').textContent = `Ходов: ${moves} · цель ${par}`;
  $('btnNext').style.display = levelIdx < LEVELS.length - 1 ? '' : 'none';
  winSnd();
  if (navigator.vibrate) navigator.vibrate([12, 60, 12]);
  setTimeout(() => showScreen('result'), 650);
}

function doMove(dk, instant){
  if (mode !== 'play' || won || anim) return false;
  if (!DIRS[dk]) return false;
  const path = computeSlide(rock.x, rock.y, dk);
  if (path.length < 2) return false;               // ход без движения не считается
  undoStack.push({ x: rock.x, y: rock.y, raked: rakedDir.slice(), moves });
  moves++;
  const d = DKEYS.indexOf(dk);
  if (instant){
    for (const c of path) rakedDir[c.y * gw + c.x] = d;
    rock = { x: path[path.length - 1].x, y: path[path.length - 1].y };
    updateHud(); checkWin();
  } else {
    const dur = Math.min(250, 130 + 22 * (path.length - 1));
    anim = { path, d, t0: performance.now(), dur };
    rakedDir[path[0].y * gw + path[0].x] = d;
    slideSnd(dur);
    updateHud();
  }
  return true;
}
window.__move = dk => doMove(dk, true);            // для автотестов

function finishAnim(){
  const { path, d } = anim;
  for (const c of path) rakedDir[c.y * gw + c.x] = d;
  rock = { x: path[path.length - 1].x, y: path[path.length - 1].y };
  anim = null;
  thudSnd();
  if (navigator.vibrate) navigator.vibrate(6);
  updateHud();
  checkWin();
}

function undo(){
  if (mode !== 'play' || won || anim || !undoStack.length) return;
  const s = undoStack.pop();
  rock = { x: s.x, y: s.y };
  rakedDir = s.raked;
  moves = s.moves;
  updateHud();
}

/* ═══════════ уровень ═══════════ */
function startLevel(i){
  levelIdx = i;
  const L = LEVELS[i];
  mode = 'play'; won = false; moves = 0; undoStack = []; anim = null;
  cells = L.map.slice();
  gh = cells.length; gw = cells[0].length;
  rakedDir = new Int8Array(gw * gh).fill(-1);
  sandTotal = 0;
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++){
    if (isSand(x, y)) sandTotal++;
    if (cells[y][x] === 'S') rock = { x, y };
  }
  $('lvlName').innerHTML = `Уровень ${i + 1}<small>${L.name}</small>`;
  showScreen(null);
  $('hud').style.display = 'flex';
  $('subhud').style.display = 'flex';
  layout();
  updateHud();
  if (i === 0 && !localStorage.getItem('sad_hint')){
    showHint('Проведи пальцем в любую сторону —\nкамень заскользит до упора\nи проборонит песок');
    localStorage.setItem('sad_hint', '1');
  }
}

let hintTimer = 0;
function showHint(text){
  const h = $('hint');
  clearTimeout(hintTimer);
  if (!text){ h.classList.add('hide'); return; }
  h.textContent = text;
  h.classList.remove('hide');
  hintTimer = setTimeout(() => h.classList.add('hide'), 5000);
}

function updateHud(){
  $('movesTxt').innerHTML = `Ходы: ${moves} <span class="par">· цель ${LEVELS[levelIdx].par}</span>`;
  $('rakebar').style.width = (100 * rakedCount() / sandTotal) + '%';
  $('btnUndo').disabled = !undoStack.length;
}

/* ═══════════ отрисовка ═══════════ */
function layout(){
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  CW = wrap.clientWidth; CH = wrap.clientHeight;
  cvs.width = Math.round(CW * DPR); cvs.height = Math.round(CH * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (mode !== 'play') return;
  const padT = 112, padB = 30, padX = 18;
  cs = Math.floor(Math.min((CW - padX * 2) / gw, (CH - padT - padB) / gh));
  ox = Math.round((CW - gw * cs) / 2);
  oy = Math.round(padT + (CH - padT - padB - gh * cs) / 2);
  buildBase();
}

function sandUnionPath(){
  const p = new Path2D();
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++)
    if (isSand(x, y)) p.rect(ox + x * cs, oy + y * cs, cs, cs);
  return p;
}

function buildBase(){
  base = document.createElement('canvas');
  base.width = cvs.width; base.height = cvs.height;
  const b = base.getContext('2d');
  b.setTransform(DPR, 0, 0, DPR, 0, 0);
  const union = sandUnionPath();

  /* песчаная «плита» с мягкой тенью */
  b.save();
  b.shadowColor = 'rgba(96,74,45,.30)';
  b.shadowBlur = 18; b.shadowOffsetY = 7;
  b.fillStyle = '#f0e5c9';
  b.fill(union);
  b.restore();

  /* лёгкая пятнистость песка */
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++){
    if (!isSand(x, y)) continue;
    const v = hash(x * 7 + 1, y * 13 + 3);
    b.fillStyle = v > .5 ? `rgba(255,250,235,${(v - .5) * .35})` : `rgba(196,168,120,${(.5 - v) * .30})`;
    b.fillRect(ox + x * cs, oy + y * cs, cs, cs);
  }

  /* фоновая текстура граблей: тонкие волнистые линии по всему песку */
  b.save();
  b.clip(union);
  b.strokeStyle = 'rgba(146,120,84,.10)';
  b.lineWidth = Math.max(1, cs * .018);
  const step = cs / 5;
  for (let yy = oy + step * .5; yy < oy + gh * cs; yy += step){
    b.beginPath();
    for (let xx = ox; xx <= ox + gw * cs; xx += 3){
      const wave = Math.sin(xx / (cs * .8) + yy * .13) * cs * .045;
      xx === ox ? b.moveTo(xx, yy + wave) : b.lineTo(xx, yy + wave);
    }
    b.stroke();
  }

  /* концентрические круги вокруг валунов (как в настоящем дзен-саду) */
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++){
    if (cells[y][x] !== '#') continue;
    const cx = ox + (x + .5) * cs, cy = oy + (y + .5) * cs;
    for (let k = 1; k <= 3; k++){
      b.beginPath();
      b.arc(cx, cy, cs * (.42 + k * .34), 0, Math.PI * 2);
      b.strokeStyle = `rgba(134,108,72,${.30 - k * .07})`;
      b.lineWidth = Math.max(1, cs * .045);
      b.stroke();
      b.beginPath();
      b.arc(cx, cy - cs * .03, cs * (.42 + k * .34), 0, Math.PI * 2);
      b.strokeStyle = `rgba(255,250,235,${.22 - k * .05})`;
      b.lineWidth = Math.max(1, cs * .03);
      b.stroke();
    }
  }
  b.restore();

  /* контур песчаной области */
  b.strokeStyle = 'rgba(118,95,62,.35)';
  b.lineWidth = 1.5;
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++){
    if (!isSand(x, y)) continue;
    const px = ox + x * cs, py = oy + y * cs;
    b.beginPath();
    if (!isSand(x, y - 1)){ b.moveTo(px, py); b.lineTo(px + cs, py); }
    if (!isSand(x, y + 1)){ b.moveTo(px, py + cs); b.lineTo(px + cs, py + cs); }
    if (!isSand(x - 1, y)){ b.moveTo(px, py); b.lineTo(px, py + cs); }
    if (!isSand(x + 1, y)){ b.moveTo(px + cs, py); b.lineTo(px + cs, py + cs); }
    b.stroke();
  }

  /* валуны */
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++)
    if (cells[y][x] === '#') drawBoulder(b, x, y);
}

function drawBoulder(b, x, y){
  const cx = ox + (x + .5) * cs, cy = oy + (y + .5) * cs;
  const seed = x * 31 + y * 57;
  const r = cs * (.40 + hash(seed, 2) * .06);
  /* тень */
  b.save();
  b.translate(cx + cs * .04, cy + cs * .12);
  b.scale(1, .55);
  b.beginPath(); b.arc(0, 0, r * 1.02, 0, Math.PI * 2);
  b.fillStyle = 'rgba(84,64,38,.30)';
  b.filter = 'blur(' + (cs * .06) + 'px)';
  b.fill();
  b.restore();
  /* тело: неровный многоугольник */
  const pts = [];
  const N = 9;
  for (let i = 0; i < N; i++){
    const a = i / N * Math.PI * 2;
    const rr = r * (.82 + hash(seed, i + 10) * .30);
    pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * .88]);
  }
  b.beginPath();
  b.moveTo((pts[N - 1][0] + pts[0][0]) / 2, (pts[N - 1][1] + pts[0][1]) / 2);
  for (let i = 0; i < N; i++){
    const nx = (pts[i][0] + pts[(i + 1) % N][0]) / 2, ny = (pts[i][1] + pts[(i + 1) % N][1]) / 2;
    b.quadraticCurveTo(pts[i][0], pts[i][1], nx, ny);
  }
  b.closePath();
  const warm = hash(seed, 4);
  const g = b.createRadialGradient(cx - r * .35, cy - r * .40, r * .1, cx, cy, r * 1.15);
  g.addColorStop(0, warm > .5 ? '#b0a390' : '#a89d8d');
  g.addColorStop(.55, warm > .5 ? '#857463' : '#7d7264');
  g.addColorStop(1, '#57493c');
  b.fillStyle = g;
  b.fill();
  b.strokeStyle = 'rgba(52,42,32,.35)';
  b.lineWidth = 1;
  b.stroke();
  /* мох */
  const ma = hash(seed, 5) * Math.PI * 2;
  const mx = cx + Math.cos(ma) * r * .45, my = cy + Math.abs(Math.sin(ma)) * r * .35;
  b.beginPath();
  b.ellipse(mx, my, r * .34, r * .22, hash(seed, 6) * 3, 0, Math.PI * 2);
  b.fillStyle = 'rgba(90,107,66,.75)';
  b.fill();
  b.beginPath();
  b.ellipse(mx + r * .08, my + r * .06, r * .18, r * .11, hash(seed, 7) * 3, 0, Math.PI * 2);
  b.fillStyle = 'rgba(66,82,48,.8)';
  b.fill();
  /* блик */
  b.beginPath();
  b.ellipse(cx - r * .3, cy - r * .38, r * .22, r * .12, -.5, 0, Math.PI * 2);
  b.fillStyle = 'rgba(255,250,238,.28)';
  b.fill();
}

/* борозды проборонённой клетки — ВДОЛЬ направления хода */
function grooveLine(px, py, off, horiz, i, shift){
  ctx.beginPath();
  for (let t = 0; t <= cs; t += 3){
    const base = horiz ? px + t : py + t;
    const wob = Math.sin(base / (cs * .9) + i * 1.7) * cs * .05 + shift;
    if (horiz) t === 0 ? ctx.moveTo(px, py + off + wob) : ctx.lineTo(px + t, py + off + wob);
    else       t === 0 ? ctx.moveTo(px + off + wob, py) : ctx.lineTo(px + off + wob, py + t);
  }
  ctx.stroke();
}
function drawRaked(x, y, d){
  const px = ox + x * cs, py = oy + y * cs;
  const horiz = d === 1 || d === 3;
  const n = 4;
  ctx.lineCap = 'round';
  for (let i = 0; i < n; i++){
    const off = cs * (i + .5) / n;
    /* тёмная борозда с мягкой «тенью» */
    ctx.strokeStyle = 'rgba(112,88,56,.40)';
    ctx.lineWidth = Math.max(1, cs * .06);
    grooveLine(px, py, off, horiz, i, 0);
    /* светлый гребень рядом — эффект объёма */
    ctx.strokeStyle = 'rgba(255,250,236,.42)';
    ctx.lineWidth = Math.max(1, cs * .045);
    grooveLine(px, py, off, horiz, i, cs * .055);
  }
  ctx.lineCap = 'butt';
}

function drawRock(fx, fy){
  const cx = ox + (fx + .5) * cs, cy = oy + (fy + .5) * cs;
  /* мягкая тень */
  ctx.save();
  ctx.translate(cx + cs * .05, cy + cs * .14);
  ctx.scale(1, .5);
  ctx.beginPath(); ctx.arc(0, 0, cs * .36, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(70,52,30,.35)';
  ctx.filter = 'blur(' + (cs * .05) + 'px)';
  ctx.fill();
  ctx.restore();
  /* графитовый голыш */
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-.14);
  const g = ctx.createRadialGradient(-cs * .12, -cs * .13, cs * .04, 0, 0, cs * .45);
  g.addColorStop(0, '#928d84');
  g.addColorStop(.45, '#5b564f');
  g.addColorStop(1, '#2f2c27');
  ctx.beginPath();
  ctx.ellipse(0, 0, cs * .355, cs * .295, 0, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();
  /* блик */
  ctx.beginPath();
  ctx.ellipse(-cs * .13, -cs * .14, cs * .10, cs * .055, -.5, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,.32)';
  ctx.fill();
  ctx.restore();
}

const easeOut = t => 1 - Math.pow(1 - t, 3);

function render(){
  ctx.clearRect(0, 0, CW, CH);
  if (mode !== 'play' || !base) return;
  ctx.drawImage(base, 0, 0, CW, CH);

  let fx = rock.x, fy = rock.y;
  if (anim){
    const p = easeOut(Math.min(1, (performance.now() - anim.t0) / anim.dur));
    const path = anim.path, last = path.length - 1;
    /* борозда появляется вслед за камнем */
    const passed = Math.min(last, Math.floor(p * last + .35));
    for (let i = 0; i <= passed; i++)
      rakedDir[path[i].y * gw + path[i].x] = anim.d;
    fx = path[0].x + (path[last].x - path[0].x) * p;
    fy = path[0].y + (path[last].y - path[0].y) * p;
  }

  /* единая тонировка проборонённого — без швов между клетками */
  const tint = new Path2D();
  let any = false;
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++)
    if (rakedDir[y * gw + x] >= 0){ tint.rect(ox + x * cs, oy + y * cs, cs, cs); any = true; }
  if (any){ ctx.fillStyle = 'rgba(168,138,95,.20)'; ctx.fill(tint); }
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++){
    const d = rakedDir[y * gw + x];
    if (d >= 0) drawRaked(x, y, d);
  }

  drawRock(fx, fy);

  if (anim && performance.now() - anim.t0 >= anim.dur) finishAnim();
}

function loop(){
  requestAnimationFrame(loop);
  render();
}

/* ═══════════ ввод: свайпы ═══════════ */
let swipe = null; // {x, y, done}
wrap.addEventListener('pointerdown', ev => {
  if (ev.target.closest('button') || mode !== 'play') return;
  audio(); if (AC && AC.state === 'suspended') AC.resume();
  swipe = { x: ev.clientX, y: ev.clientY, done: false };
});
wrap.addEventListener('pointermove', ev => {
  if (!swipe || swipe.done) return;
  const dx = ev.clientX - swipe.x, dy = ev.clientY - swipe.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  swipe.done = true;
  const dk = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U');
  doMove(dk, false);
});
addEventListener('pointerup', () => swipe = null);
addEventListener('pointercancel', () => swipe = null);
addEventListener('keydown', ev => {
  const map = { ArrowUp:'U', ArrowRight:'R', ArrowDown:'D', ArrowLeft:'L' };
  if (map[ev.key]){ ev.preventDefault(); doMove(map[ev.key], false); }
  if (ev.key === 'z' || ev.key === 'Z') undo();
});

/* ═══════════ экраны и кнопки ═══════════ */
function showScreen(name){
  ['menu', 'result'].forEach(s => $(s).classList.toggle('hide', s !== name));
}
function buildMenu(){
  const g = $('lvlgrid');
  g.innerHTML = '';
  LEVELS.forEach((L, i) => {
    const unlocked = i === 0 || (stars[i - 1] || 0) > 0;
    const b = document.createElement('button');
    b.className = 'chip';
    b.disabled = !unlocked;
    b.innerHTML = `${i + 1}<small>${'★'.repeat(stars[i] || 0)}</small>`;
    b.onclick = () => startLevel(i);
    g.appendChild(b);
  });
}
function toMenu(){
  mode = 'menu';
  ['hud', 'subhud'].forEach(id => $(id).style.display = 'none');
  showHint('');
  buildMenu();
  showScreen('menu');
}
$('btnPlay').onclick = () => {
  let i = 0;
  while (i < LEVELS.length - 1 && (stars[i] || 0) > 0) i++;
  startLevel(i);
};
$('btnMenu').onclick = toMenu;
$('btnResMenu').onclick = toMenu;
$('btnRestart').onclick = () => startLevel(levelIdx);
$('btnAgain').onclick = () => startLevel(levelIdx);
$('btnNext').onclick = () => startLevel(Math.min(levelIdx + 1, LEVELS.length - 1));
$('btnUndo').onclick = undo;
$('btnSnd').textContent = sndOn ? '🔊' : '🔇';
$('btnSnd').onclick = () => {
  sndOn = !sndOn;
  localStorage.setItem('sad_snd', sndOn ? '1' : '0');
  $('btnSnd').textContent = sndOn ? '🔊' : '🔇';
};
addEventListener('resize', layout);

/* SDK Яндекс Игр — если есть */
if (window.YaGames) YaGames.init().then(y => { window.ysdk = y; y.features?.LoadingAPI?.ready?.(); }).catch(() => {});

buildMenu();
showScreen('menu');
layout();
loop();
</script>
