<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1226">
<title>Захват — 3D</title>
<meta name="description" content="Захват — 3D-стратегия: тяни связи между башнями, усиливай свои и захватывай чужие.">
<style>
  :root{ --ink:#eef0ff; --muted:#a7adda; --p:#2f6fe0; --e:#e23b4e; --panel:rgba(255,255,255,.06); }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{ font-family:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    color:var(--ink); user-select:none; background:#9fd0e8; height:100%; }
  #app{position:fixed; inset:0;}
  canvas{display:block; touch-action:none;}
  .labels{position:fixed; inset:0; pointer-events:none; overflow:hidden;}
  .tlabel{ background:#fff; border:2.5px solid #888; border-radius:999px; color:#333;
    font-weight:800; font-size:14px; padding:1px 9px; transform:translate(-50%,-50%);
    box-shadow:0 3px 8px rgba(0,0,0,.25); white-space:nowrap; }

  .hud{ position:fixed; top:0; left:0; right:0; display:flex; align-items:center; gap:10px;
    padding:max(10px,env(safe-area-inset-top)) 14px 10px; z-index:10; }
  .hud .title{font-weight:800; font-size:17px; letter-spacing:-.3px; white-space:nowrap; text-shadow:0 2px 6px rgba(0,0,0,.4);}
  .hud .title small{display:block; font-weight:600; font-size:11px; color:#eaf3ff; opacity:.85; margin-top:1px;}
  .counts{display:flex; gap:8px; margin-left:auto; align-items:center;}
  .pill{background:rgba(15,18,38,.5); border:1px solid rgba(255,255,255,.14); border-radius:999px;
    padding:5px 11px; font-weight:800; font-size:14px; display:flex; align-items:center; gap:6px; backdrop-filter:blur(6px);}
  .pill .dot{width:9px;height:9px;border-radius:50%;} .dot.p{background:var(--p);} .dot.e{background:var(--e);}
  .iconbtn{background:rgba(15,18,38,.5); border:1px solid rgba(255,255,255,.16); color:#fff;
    width:38px;height:38px;border-radius:11px; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(6px);}
  .iconbtn:active{transform:translateY(1px);}
  .hint{ position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:10;
    background:rgba(15,18,38,.62); border:1px solid rgba(255,255,255,.12); backdrop-filter:blur(6px);
    color:#eaf0ff; font-size:12.5px; padding:8px 15px; border-radius:999px; max-width:92%; text-align:center; transition:opacity .4s;}

  .overlay{ position:fixed; inset:0; z-index:30; display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; text-align:center; padding:26px; background:rgba(15,18,38,.82); backdrop-filter:blur(7px); }
  .overlay.show{display:flex;}
  .overlay .big{font-size:38px; font-weight:800; letter-spacing:-1px;}
  .overlay.win .big{background:linear-gradient(120deg,#21d4fd,#2bffb0);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .overlay.lose .big{color:var(--e);}
  .overlay .sub{color:var(--muted); font-size:15px; max-width:300px;}
  .row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
  .btn{border:1px solid rgba(255,255,255,.14); background:var(--panel); color:var(--ink);
    font-family:inherit; font-weight:700; font-size:15px; padding:12px 20px; border-radius:12px; cursor:pointer;}
  .btn.primary{background:linear-gradient(120deg,#7c5cff,#a17bff); border-color:transparent; box-shadow:0 8px 22px rgba(124,92,255,.35);}
  .btn:active{transform:translateY(2px);}
  .levels{display:grid; grid-template-columns:repeat(4,56px); gap:12px; justify-content:center;}
  .lvl{width:56px;height:56px;border-radius:14px; background:var(--panel); border:1px solid rgba(255,255,255,.14);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:20px; cursor:pointer; color:var(--ink);}
  .lvl.locked{opacity:.35; cursor:default;} .lvl.done{border-color:#2bffb0; color:#2bffb0;}
  .ovh{font-size:13px; color:var(--muted); letter-spacing:1.5px; text-transform:uppercase; font-weight:700;}

  #loading{ position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:linear-gradient(160deg,#0f1226,#171a3a); color:#cfe0ff; }
  .spinner{width:42px;height:42px;border-radius:50%;border:4px solid rgba(255,255,255,.18); border-top-color:#7c5cff; animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  #err{display:none; max-width:80%; text-align:center; color:#ffd3da; font-size:14px; line-height:1.6;}
</style>
</head>
<body>
  <div id="app"></div>
  <div class="labels" id="labels"></div>

  <div class="hud">
    <div class="title">Захват<small id="mapName">Карта 1</small></div>
    <div class="counts">
      <div class="pill"><span class="dot p"></span><span id="cntP">0</span></div>
      <div class="pill"><span class="dot e"></span><span id="cntE">0</span></div>
      <button class="iconbtn" id="speedBtn">×1</button>
      <button class="iconbtn" id="menuBtn">☰</button>
    </div>
  </div>
  <div class="hint" id="hint">Тяни от своей башни к другой — создать связь. Убрать: тапни по линии.</div>

  <div class="overlay" id="ovEnd"><div class="big" id="ovTitle"></div><div class="sub" id="ovSub"></div><div class="row" id="ovRow"></div></div>
  <div class="overlay" id="ovMenu"><div class="ovh">Карты</div><div class="levels" id="lvlGrid"></div><div class="row"><button class="btn" id="closeMenu">Закрыть</button></div></div>

  <div id="loading"><div class="spinner"></div><div>Загружаем 3D-мир…</div><div id="err"></div></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const $ = id => document.getElementById(id);
function fail(msg){ const e=document.getElementById('err'); e.style.display='block';
  e.textContent = msg + ' Обнови страницу или попробуй другой браузер.'; }

// ---------------- game constants & data ----------------
const PROD_BASE=2.2, CAP_BASE=30, MAX_LEVEL=4, MAXLINKS=3, BOT_INTERVAL=1.45;
const ISL_W=15, ISL_D=10, GROUNDPAD=0.84;
const COL = { 0:0xc9ceda, 1:0x4f8bff, 2:0xff5c72 };       // soldiers / accents
const SOLID = { 0:0xc2c8d2, 1:0x3f80ee, 2:0xe8485c };      // solid team color for towers & links
const SOLIDD= { 0:0x8b92a0, 1:0x2456b0, 2:0xb02a3c };      // darker base ring
const TINT= { 0:0xffffff, 1:0xd2e2ff, 2:0xffd6dc };        // (unused now) gentle tower tint
const CSS = { 0:'#7d8499', 1:'#2f6fe0', 2:'#e23b4e' };
const STORE='g_zahvat_progress';

const MAPS = [
  { name:'Первый контакт', aggro:0.35, nodes:[
    {x:.16,y:.5,o:1,t:22,l:1},{x:.84,y:.5,o:2,t:22,l:1},
    {x:.5,y:.28,o:0,t:10,l:1},{x:.5,y:.72,o:0,t:10,l:1} ] },
  { name:'Перекрёсток', aggro:0.45, nodes:[
    {x:.12,y:.5,o:1,t:26,l:1},{x:.88,y:.5,o:2,t:26,l:1},{x:.5,y:.5,o:0,t:16,l:1},
    {x:.34,y:.24,o:0,t:9,l:1},{x:.66,y:.24,o:0,t:9,l:1},{x:.34,y:.76,o:0,t:9,l:1},{x:.66,y:.76,o:0,t:9,l:1} ] },
  { name:'Клин', aggro:0.5, nodes:[
    {x:.13,y:.3,o:1,t:20,l:1},{x:.13,y:.7,o:1,t:20,l:1},
    {x:.87,y:.3,o:2,t:24,l:1},{x:.87,y:.7,o:2,t:24,l:1},
    {x:.5,y:.5,o:0,t:18,l:1},{x:.5,y:.18,o:0,t:11,l:1},{x:.5,y:.82,o:0,t:11,l:1} ] },
  { name:'Окружение', aggro:0.55, nodes:[
    {x:.5,y:.5,o:1,t:28,l:1},{x:.5,y:.16,o:0,t:12,l:1},{x:.5,y:.84,o:0,t:12,l:1},
    {x:.2,y:.3,o:2,t:22,l:1},{x:.2,y:.7,o:0,t:12,l:1},{x:.8,y:.3,o:0,t:12,l:1},{x:.8,y:.7,o:2,t:22,l:1} ] },
  { name:'Две крепости', aggro:0.6, nodes:[
    {x:.15,y:.5,o:1,t:30,l:2},{x:.85,y:.5,o:2,t:34,l:2},
    {x:.4,y:.3,o:0,t:14,l:1},{x:.6,y:.7,o:0,t:14,l:1},{x:.6,y:.3,o:0,t:14,l:1},{x:.4,y:.7,o:0,t:14,l:1} ] },
  { name:'Архипелаг', aggro:0.68, nodes:[
    {x:.1,y:.5,o:1,t:24,l:1},{x:.9,y:.2,o:2,t:22,l:1},{x:.9,y:.8,o:2,t:22,l:1},
    {x:.35,y:.2,o:0,t:10,l:1},{x:.35,y:.8,o:0,t:10,l:1},{x:.55,y:.5,o:0,t:16,l:1},
    {x:.7,y:.3,o:0,t:11,l:1},{x:.7,y:.7,o:0,t:11,l:1},{x:.5,y:.15,o:0,t:9,l:1},{x:.5,y:.85,o:0,t:9,l:1} ] },
];

// ---------------- three.js setup ----------------
let renderer, labelRenderer, scene, camera, raycaster, groundPlane;
let MODELS={}, GROUND_TOP=0, stripeTex;
let nodes=[], links=[], soldiers=[], decor=[];
let mapIndex=0, running=true, ended=false, speed=1, botTimer=0, progress=+(localStorage.getItem(STORE)||0);
let drag=null, dragLine=null, linkSig='';
const pointer=new THREE.Vector2();

const cap=n=>CAP_BASE*n.l, prod=n=>PROD_BASE*n.l;
function worldPos(nx,ny){ return new THREE.Vector3((nx-0.5)*ISL_W*GROUNDPAD, GROUND_TOP, (ny-0.5)*ISL_D*GROUNDPAD); }
function camViewSize(){ const aspect=innerWidth/innerHeight;
  const halfW=(ISL_W+ISL_D)*0.5*0.62, halfH=(ISL_W+ISL_D)*0.5*0.40;
  return Math.max(halfH, halfW/aspect)*1.06; }

async function init(){
  renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.getElementById('app').appendChild(renderer.domElement);

  labelRenderer = new CSS2DRenderer({ element: document.getElementById('labels') });
  labelRenderer.setSize(innerWidth, innerHeight);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9fd0e8);
  scene.fog = new THREE.Fog(0x9fd0e8, 38, 70);

  // camera: isometric orthographic
  const aspect = innerWidth/innerHeight; const vs = camViewSize();
  camera = new THREE.OrthographicCamera(-vs*aspect, vs*aspect, vs, -vs, 0.1, 200);
  camera.position.set(18, 21, 18); camera.lookAt(0, 0.4, 0);

  // lights
  scene.add(new THREE.HemisphereLight(0xffffff, 0x6a7a55, 0.95));
  const sun = new THREE.DirectionalLight(0xfff2d6, 1.25);
  sun.position.set(14, 26, 8); sun.castShadow = true;
  sun.shadow.mapSize.set(2048,2048);
  const sc=sun.shadow.camera; sc.left=-16; sc.right=16; sc.top=12; sc.bottom=-12; sc.near=1; sc.far=80;
  sun.shadow.bias=-0.0004; scene.add(sun);

  raycaster = new THREE.Raycaster();
  groundPlane = new THREE.Mesh(new THREE.PlaneGeometry(200,200).rotateX(-Math.PI/2),
                               new THREE.MeshBasicMaterial({visible:false}));
  scene.add(groundPlane);

  // stripe texture for flow ribbons
  stripeTex = makeStripeTexture();

  // load models
  const loader = new GLTFLoader();
  const names = { tile:'tile.glb', lvl1:'lvl1.glb', lvl2:'lvl2.glb', lvl3:'lvl3.glb', lvl4:'lvl4.glb',
                  tree:'tree.glb', treeL:'tree-large.glb', rocks:'rocks.glb' };
  const entries = await Promise.all(Object.entries(names).map(async ([k,f])=>{
    const g = await loader.loadAsync('models/'+f); return [k, g.scene];
  }));
  for(const [k,s] of entries) MODELS[k]=s;

  buildGround();
  document.getElementById('loading').style.display='none';

  // drag line
  const lg = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]);
  dragLine = new THREE.Line(lg, new THREE.LineBasicMaterial({color:0xffffff, transparent:true, opacity:0.85}));
  dragLine.visible=false; scene.add(dragLine);

  bindInput();
  loadMap(0);
  renderer.setAnimationLoop(frame);
}

function makeStripeTexture(){
  const c=document.createElement('canvas'); c.width=16; c.height=64; const x=c.getContext('2d');
  x.clearRect(0,0,16,64);
  x.fillStyle='rgba(255,255,255,0.9)';
  for(let i=0;i<2;i++){ const y=i*32; x.beginPath(); x.moveTo(2,y+6); x.lineTo(14,y+16); x.lineTo(2,y+26); x.lineTo(2,y+20); x.lineTo(9,y+16); x.lineTo(2,y+12); x.closePath(); x.fill(); }
  const t=new THREE.CanvasTexture(c); t.wrapS=THREE.RepeatWrapping; t.wrapT=THREE.RepeatWrapping; return t;
}

function buildGround(){
  const tileMesh = findMesh(MODELS.tile);
  tileMesh.geometry.computeBoundingBox();
  const bb=tileMesh.geometry.boundingBox; GROUND_TOP = bb.max.y; const tileBottom=bb.min.y;
  const geo=tileMesh.geometry, mat=tileMesh.material.clone(); mat.metalness=0; mat.roughness=0.9;
  const cols=Math.ceil(ISL_W)+2, rows=Math.ceil(ISL_D)+2;
  // green tiles with small gaps (reads as a tiled world)
  const inst=new THREE.InstancedMesh(geo, mat, cols*rows);
  inst.receiveShadow=true; inst.castShadow=true;
  const m=new THREE.Matrix4(), q=new THREE.Quaternion(), s=new THREE.Vector3(0.93,1,0.93), p=new THREE.Vector3(); let i=0;
  for(let cx=0;cx<cols;cx++) for(let cz=0;cz<rows;cz++){
    p.set((cx-(cols-1)/2), 0, (cz-(rows-1)/2)); m.compose(p,q,s); inst.setMatrixAt(i++, m);
  }
  inst.instanceMatrix.needsUpdate=true; scene.add(inst);
  // brown island base -> gives the land thickness & cliffs
  const base=new THREE.Mesh(new THREE.BoxGeometry(cols-0.5, 2.2, rows-0.5),
    new THREE.MeshStandardMaterial({color:0x7c5a34, roughness:1, metalness:0}));
  base.position.set(0, tileBottom-1.1, 0); base.receiveShadow=true; base.castShadow=true; scene.add(base);
  // darker soil band just under the grass
  const soil=new THREE.Mesh(new THREE.BoxGeometry(cols-0.18, 0.22, rows-0.18),
    new THREE.MeshStandardMaterial({color:0x5a8a3a, roughness:1}));
  soil.position.set(0, tileBottom-0.02, 0); soil.receiveShadow=true; scene.add(soil);
}
function findMesh(root){ let found=null; root.traverse(o=>{ if(!found && o.isMesh) found=o; }); return found; }

// ---------------- map / nodes ----------------
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function genDecor(seed){ const rng=mulberry32(seed*977+13), out=[]; let tries=0;
  while(out.length<26 && tries<800){ tries++;
    const nx=0.04+rng()*0.92, ny=0.05+rng()*0.9; let ok=true;
    for(const n of MAPS[seed].nodes){ if(Math.hypot(nx-n.x, ny-n.y)<0.12){ ok=false; break; } }
    if(ok) for(const d of out){ if(Math.hypot(nx-d.nx, ny-d.ny)<0.07){ ok=false; break; } }
    if(ok){ const r=rng(); out.push({ nx, ny, type: r<0.5?'tree': r<0.78?'treeL':'rocks', rot:rng()*6.28, s:0.8+rng()*0.5 }); }
  }
  return out;
}

let nodeGroup=null, decorGroup=null, soldierGroup=null, linkGroup=null;
function clearGroup(g){ if(!g) return; while(g.children.length) g.remove(g.children[0]); }

function loadMap(i){
  mapIndex=i; const m=MAPS[i];
  // reset groups
  if(nodeGroup) scene.remove(nodeGroup); if(decorGroup) scene.remove(decorGroup);
  if(soldierGroup) scene.remove(soldierGroup); if(linkGroup) scene.remove(linkGroup);
  nodeGroup=new THREE.Group(); decorGroup=new THREE.Group(); soldierGroup=new THREE.Group(); linkGroup=new THREE.Group();
  scene.add(nodeGroup); scene.add(decorGroup); scene.add(soldierGroup); scene.add(linkGroup);
  // clear labels
  document.getElementById('labels').innerHTML='';

  nodes = m.nodes.map((d,idx)=>{ const p=worldPos(d.x,d.y);
    return { id:idx, nx:d.x, ny:d.y, x:p.x, z:p.z, o:d.o, t:d.t, l:d.l||1, atk:0, view:null, lr:-1, or:-1 }; });
  links=[]; soldiers=[]; linkSig=''; drag=null; botTimer=0; ended=false; running=true; speed=1;
  document.getElementById('speedBtn').textContent='×1';
  document.getElementById('mapName').textContent='Карта '+(i+1)+' · '+m.name;
  hideOverlay('ovEnd'); hideOverlay('ovMenu');
  document.getElementById('hint').style.opacity = i===0?'1':'0';

  // decor
  decor=genDecor(i);
  for(const d of decor){ const src=MODELS[d.type]; const o=src.clone(true);
    o.traverse(c=>{ if(c.isMesh){ c.castShadow=true; c.receiveShadow=true; } });
    const p=worldPos(d.nx,d.ny); o.position.set(p.x,GROUND_TOP,p.z); o.rotation.y=d.rot; o.scale.setScalar(d.s);
    decorGroup.add(o); }

  for(const n of nodes) buildTower(n);
}

function buildTower(n){
  if(n.view){ nodeGroup.remove(n.view.group); if(n.view.label) n.view.group.remove(n.view.label); }
  const group=new THREE.Group(); group.position.set(n.x, GROUND_TOP, n.z); group.scale.setScalar(1.25);
  const teamMat=new THREE.MeshStandardMaterial({ color:SOLID[n.o], roughness:0.55, metalness:0.05 });
  const model=MODELS['lvl'+n.l].clone(true);
  model.traverse(c=>{ if(c.isMesh){ c.castShadow=true; c.receiveShadow=true; c.material=teamMat; c.userData.nodeId=n.id; } });
  group.add(model);
  // darker colored base disc (grounds the tower, shows team)
  const disc=new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.66,0.14,28),
    new THREE.MeshStandardMaterial({ color:SOLIDD[n.o], roughness:0.7 }));
  disc.position.y=0.03; disc.receiveShadow=true; group.add(disc);
  // invisible pick disc (easy tap target)
  const pick=new THREE.Mesh(new THREE.CylinderGeometry(0.85,0.85,1.8,12), new THREE.MeshBasicMaterial({visible:false}));
  pick.position.y=0.9; pick.userData.nodeId=n.id; group.add(pick);
  // label
  const div=document.createElement('div'); div.className='tlabel';
  const label=new CSS2DObject(div); label.position.set(0,1.75,0); group.add(label);
  nodeGroup.add(group);
  n.view={group, model, div, label}; n.lr=n.l; n.or=n.o;
}

// ---------------- simulation (same rules as before) ----------------
function findLink(f,t){ return links.find(L=>L.from===f && L.to===t); }
function removeLink(L){ const i=links.indexOf(L); if(i>=0) links.splice(i,1); }
function removeLinksFrom(id){ links.filter(L=>L.from===id).forEach(removeLink); }
function toggleLink(from,to){ if(from===to) return; const src=nodes[from];
  const ex=findLink(from,to); if(ex){ removeLink(ex); return; }
  const out=links.filter(L=>L.from===from); if(out.length>=MAXLINKS) removeLink(out[0]);
  links.push({from,to,o:src.o,accum:0}); }

function spawnSoldier(from,to){ soldiers.push({ x:from.x, z:from.z, tid:to.id, o:from.o, mesh:null }); }
function applyArrival(node, owner){
  if(node.o===owner){ node.t+=1; }
  else { node.atk=0.6; node.t-=1; if(node.t<=0){ node.o=owner; node.t=-node.t; node.atk=0; removeLinksFrom(node.id); } }
}

function step(dt){
  for(const n of nodes){
    if(n.atk>0) n.atk=Math.max(0,n.atk-dt);
    if(n.o===0) continue;
    links.filter(L=>L.from===n.id && L.o!==n.o).forEach(removeLink);
    const out=links.filter(L=>L.from===n.id);
    if(out.length===0){ const c=cap(n); if(n.t<c && n.atk<=0) n.t=Math.min(c, n.t+prod(n)*dt); }
    else { const per=(prod(n)/out.length)*dt;
      for(const L of out){ L.accum+=per; while(L.accum>=1){ L.accum-=1; spawnSoldier(n, nodes[L.to]); } } }
    if(n.t>cap(n)+0.001 && n.l<MAX_LEVEL) n.l++;
  }
  // soldiers move in world (x,z)
  const SP=4.0*Math.max(1,1);
  for(let i=soldiers.length-1;i>=0;i--){ const s=soldiers[i], tn=nodes[s.tid];
    const dx=tn.x-s.x, dz=tn.z-s.z, d=Math.hypot(dx,dz);
    if(d<=0.5){ applyArrival(tn,s.o); if(s.mesh) soldierGroup.remove(s.mesh); soldiers.splice(i,1); continue; }
    const v=SP*dt; s.x+=dx/d*v; s.z+=dz/d*v;
  }
  botTimer-=dt; if(botTimer<=0){ botTimer=BOT_INTERVAL; botThink(); }
  checkEnd();
}

function botThink(){
  const aggro=MAPS[mapIndex].aggro, mine=nodes.filter(n=>n.o===2); if(!mine.length) return;
  for(const L of links.filter(L=>L.o===2)){ const tn=nodes[L.to]; if(tn.o===2 && tn.t>=cap(tn)-0.5) removeLink(L); }
  const sorted=[...mine].sort((a,b)=>b.t-a.t);
  for(const src of sorted){
    if(src.t<10) continue;
    if(links.filter(L=>L.from===src.id).length>=MAXLINKS) continue;
    if(Math.random()>aggro+0.25) continue;
    let best=null,bs=Infinity;
    for(const n of nodes){ if(n.o===2) continue; if(findLink(src.id,n.id)) continue;
      const dist=Math.hypot(n.x-src.x,n.z-src.z), def=n.t+(n.o===1?6:0);
      if(def>src.t*1.15) continue; const sc=dist*0.6+def*4; if(sc<bs){ bs=sc; best=n; } }
    if(best) links.push({from:src.id,to:best.id,o:2,accum:0});
    else if(src.t>cap(src)*0.7){ let feed=null,fd=Infinity;
      for(const n of mine){ if(n===src||n.l>=MAX_LEVEL) continue; const d=Math.hypot(n.x-src.x,n.z-src.z); if(d<fd){fd=d;feed=n;} }
      if(feed && !findLink(src.id,feed.id)) links.push({from:src.id,to:feed.id,o:2,accum:0}); }
  }
}

function counts(){ let p=0,e=0; for(const n of nodes){ if(n.o===1)p++; else if(n.o===2)e++; } return {p,e}; }
function checkEnd(){ if(ended) return; const {p,e}=counts();
  const pS=soldiers.some(s=>s.o===1), eS=soldiers.some(s=>s.o===2);
  if(e===0 && !eS) endGame(true); else if(p===0 && !pS) endGame(false); }
function endGame(win){ ended=true; running=false;
  const ov=document.getElementById('ovEnd'); ov.className='overlay show '+(win?'win':'lose');
  document.getElementById('ovTitle').textContent = win?'Победа! 🎉':'Поражение';
  const row=document.getElementById('ovRow'); row.innerHTML='';
  if(win){ const next=mapIndex+1; if(next<MAPS.length && next>progress){ progress=next; localStorage.setItem(STORE,progress); }
    document.getElementById('ovSub').textContent = next<MAPS.length?'Карта зачищена. Дальше?':'Все карты пройдены! 🏆';
    if(next<MAPS.length) addBtn(row,'Следующая','primary',()=>loadMap(next));
    addBtn(row,'Заново','',()=>loadMap(mapIndex));
  } else { document.getElementById('ovSub').textContent='Враг захватил все твои башни.';
    addBtn(row,'Ещё раз','primary',()=>loadMap(mapIndex)); }
}
function addBtn(row,label,cls,fn){ const b=document.createElement('button'); b.className='btn '+cls; b.textContent=label; b.onclick=fn; row.appendChild(b); }
function hideOverlay(id){ document.getElementById(id).className='overlay'; }

// ---------------- per-frame visual sync ----------------
function syncVisuals(){
  for(const n of nodes){
    if(n.lr!==n.l || n.or!==n.o){ buildTower(n); }   // rebuild on level/owner change
    const v=n.view; if(!v) continue;
    // atk shake
    v.group.position.x = n.x + (n.atk>0?Math.sin(performance.now()*0.03)*0.06:0);
    // label
    v.div.textContent = Math.floor(n.t);
    v.div.style.borderColor = CSS[n.o];
    v.div.style.color = CSS[n.o]==='#7d8499' ? '#444' : CSS[n.o];
  }
  // soldiers meshes
  for(const s of soldiers){ if(!s.mesh){ s.mesh=new THREE.Mesh(
      new THREE.SphereGeometry(0.19,12,10), new THREE.MeshStandardMaterial({color:SOLID[s.o], roughness:0.4, emissive:SOLID[s.o], emissiveIntensity:0.15}));
      s.mesh.castShadow=true; soldierGroup.add(s.mesh); }
    s.mesh.position.set(s.x, GROUND_TOP+0.32, s.z); }
  // links — rebuild ribbon meshes when set changes
  const sig=links.map(L=>L.from+'>'+L.to+':'+L.o).join('|');
  if(sig!==linkSig){ linkSig=sig; rebuildLinks(); }
  const c=counts(); document.getElementById('cntP').textContent=c.p; document.getElementById('cntE').textContent=c.e;
}

function rebuildLinks(){
  clearGroup(linkGroup);
  const up=new THREE.Vector3(0,1,0);
  for(const L of links){ const a=nodes[L.from], b=nodes[L.to];
    const A=new THREE.Vector3(a.x,GROUND_TOP+0.22,a.z), B=new THREE.Vector3(b.x,GROUND_TOP+0.22,b.z);
    const u=new THREE.Vector3().subVectors(B,A).normalize();
    const start=A.clone().add(u.clone().multiplyScalar(0.75));
    const end=B.clone().add(u.clone().multiplyScalar(-0.95));
    const seg=new THREE.Vector3().subVectors(end,start); const L2=seg.length();
    const mat=new THREE.MeshStandardMaterial({ color:SOLID[L.o], roughness:0.45, metalness:0.05, emissive:SOLID[L.o], emissiveIntensity:0.12 });
    const tube=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,L2,12), mat);
    tube.quaternion.setFromUnitVectors(up, seg.clone().normalize());
    tube.position.copy(start).add(end).multiplyScalar(0.5);
    tube.userData.link=L; linkGroup.add(tube);
    const cone=new THREE.Mesh(new THREE.ConeGeometry(0.3,0.5,14), mat);
    cone.quaternion.setFromUnitVectors(up, u); cone.position.copy(end); cone.userData.link=L; linkGroup.add(cone);
  }
}

// ---------------- input ----------------
function setPointer(e){ pointer.x=(e.clientX/innerWidth)*2-1; pointer.y=-(e.clientY/innerHeight)*2+1; }
function pickNode(e){ setPointer(e); raycaster.setFromCamera(pointer,camera);
  const hits=raycaster.intersectObjects(nodeGroup.children, true);
  for(const h of hits){ let o=h.object; while(o){ if(o.userData && o.userData.nodeId!=null) return nodes[o.userData.nodeId]; o=o.parent; } }
  return null; }
function pickGround(e){ setPointer(e); raycaster.setFromCamera(pointer,camera);
  const h=raycaster.intersectObject(groundPlane); return h.length?h[0].point:null; }
function pickLink(e){ setPointer(e); raycaster.setFromCamera(pointer,camera);
  const hits=raycaster.intersectObjects(linkGroup.children,true);
  for(const h of hits){ const L=h.object.userData.link; if(L && L.o===1) return L; } return null; }

let downXY=null;
function bindInput(){
  const el=renderer.domElement;
  el.addEventListener('pointerdown',e=>{ if(ended) return; downXY={x:e.clientX,y:e.clientY};
    const n=pickNode(e); if(n && n.o===1){ drag={fromId:n.id}; dragLine.visible=true; document.getElementById('hint').style.opacity='0'; } });
  el.addEventListener('pointermove',e=>{ if(!drag) return; const g=pickGround(e); if(!g) return;
    const a=nodes[drag.fromId]; dragLine.geometry.setFromPoints([new THREE.Vector3(a.x,GROUND_TOP+0.4,a.z), new THREE.Vector3(g.x,GROUND_TOP+0.2,g.z)]); });
  el.addEventListener('pointerup',e=>{
    const far = downXY && Math.hypot(e.clientX-downXY.x, e.clientY-downXY.y)>14;
    if(drag){ const n=pickNode(e); if(n && n.id!==drag.fromId && far) toggleLink(drag.fromId,n.id); drag=null; dragLine.visible=false; }
    else if(!far){ const L=pickLink(e); if(L) removeLink(L); }
    downXY=null; });
  el.addEventListener('pointercancel',()=>{ drag=null; dragLine.visible=false; downXY=null; });

  document.getElementById('speedBtn').onclick=()=>{ speed=speed===1?2:1; document.getElementById('speedBtn').textContent='×'+speed; };
  document.getElementById('menuBtn').onclick=()=>{ running=false; openMenu(); };
  document.getElementById('closeMenu').onclick=()=>{ hideOverlay('ovMenu'); if(!ended) running=true; };
  addEventListener('resize',onResize);
}
function openMenu(){ const grid=document.getElementById('lvlGrid'); grid.innerHTML='';
  MAPS.forEach((m,i)=>{ const el=document.createElement('div'); const locked=i>progress;
    el.className='lvl'+(locked?' locked':'')+(i<progress?' done':''); el.textContent=i+1;
    if(!locked) el.onclick=()=>{ hideOverlay('ovMenu'); loadMap(i); }; grid.appendChild(el); });
  document.getElementById('ovMenu').className='overlay show'; }

function onResize(){ const aspect=innerWidth/innerHeight, vs=camViewSize();
  camera.left=-vs*aspect; camera.right=vs*aspect; camera.top=vs; camera.bottom=-vs; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); labelRenderer.setSize(innerWidth,innerHeight); }

// ---------------- loop ----------------
let last=performance.now();
function frame(){
  const now=performance.now(); let dt=(now-last)/1000; last=now; if(dt>0.05) dt=0.05;
  if(running && !ended) step(dt*speed);
  stripeTex.offset.y = (stripeTex.offset.y - dt*0.9) % 1;
  syncVisuals();
  renderer.render(scene,camera); labelRenderer.render(scene,camera);
}

init().catch(err=>{ console.error(err); document.querySelector('#loading .spinner').style.display='none';
  document.querySelector('#loading div').textContent='Не удалось запустить 3D.';
  fail('Ошибка загрузки: '+(err&&err.message?err.message:err)+'.'); });
</script>
