<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Выбор голоса робота</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Nunito',system-ui,'Segoe UI',sans-serif;
    background:linear-gradient(160deg,#3a1c71,#5f72be 45%,#38ef7d);
    min-height:100vh; color:#2b2b4a; display:flex; justify-content:center; padding:18px; }
  .wrap { width:100%; max-width:440px; }
  h1 { color:#fff; text-align:center; font-size:26px; margin:10px 0 4px; }
  p.sub { color:#eef2ff; text-align:center; margin-bottom:18px; font-size:15px; }
  .card { background:#fff; border-radius:22px; padding:18px; margin:14px 0; box-shadow:0 10px 30px rgba(0,0,0,.25); }
  .name { font-size:20px; font-weight:800; color:#4361ee; margin-bottom:4px; }
  .desc { font-size:14px; color:#6a6a8a; margin-bottom:12px; }
  button { width:100%; border:none; border-radius:16px; padding:16px; font-size:20px;
    font-family:inherit; font-weight:800; color:#fff; cursor:pointer;
    background:linear-gradient(90deg,#4361ee,#38ef7d); box-shadow:0 5px 0 #2a3eaa; }
  button:active { transform:translateY(3px); box-shadow:0 2px 0 #2a3eaa; }
  .hint { color:#fff; text-align:center; font-size:14px; margin-top:18px; opacity:.95; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🤖 Выбери голос робота</h1>
  <p class="sub">Нажми «Послушать» у каждого и выбери, какой нравится</p>

  <div class="card">
    <div class="name">1. Бая (baya)</div>
    <div class="desc">Мягкий, спокойный женский голос</div>
    <button onclick="play('baya')">▶️ Послушать</button>
  </div>

  <div class="card">
    <div class="name">2. Ксения (xenia)</div>
    <div class="desc">Звонкий, «молодой» женский голос</div>
    <button onclick="play('xenia')">▶️ Послушать</button>
  </div>

  <div class="card">
    <div class="name">3. Ксения (kseniya)</div>
    <div class="desc">Нейтральный женский голос</div>
    <button onclick="play('kseniya')">▶️ Послушать</button>
  </div>

  <p class="hint">Какой выбрала? Напиши мне номер или имя — этим голосом озвучу всю игру. 🙂</p>
</div>

<audio id="player"></audio>
<script>
  var p = document.getElementById('player');
  function play(name){
    p.src = 'voice_' + name + '.wav';
    p.currentTime = 0;
    p.play();
  }
</script>
</body>
</html>
